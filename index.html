                    el.style.top = (cy - oy) + 'px';
                });
            };

            const stop = (cx, cy) => {
                note.classList.remove('dragging');
                note.style.transform = '';
                note.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease';
                setTimeout(() => { note.style.transition = ''; }, 500);
                
                // Clamp all selected notes
                selectedNoteIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const clamped = clampNote(parseFloat(el.style.left), parseFloat(el.style.top));
                        el.style.left = clamped.x + 'px';
                        el.style.top = clamped.y + 'px';
                    }
                });
                save();
            };
            return { move, stop, setAltDup };
        };

        note.onmousedown = (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('.note-resize-handle')) return;
            if (e.target.closest('.note-reaction')) return;
            if (e.target.closest('.video-play-btn')) return;
            if (note.querySelector('.note-edit-ta')) return;
            if (e.target.tagName === 'A') return;
            if (window._lastFileDrop && Date.now() - window._lastFileDrop < 400) return;
            e.preventDefault();

            // Shift+click to toggle selection
            if (e.shiftKey) {
                toggleNoteSelection(data.id);
            } else if (!selectedNoteIds.has(data.id)) {
                // Click on unselected note - clear others and select this one
                clearSelection();
                selectedNoteIds.add(data.id);
                note.classList.add('selected');
            }
            
            const { move, stop, setAltDup } = startDrag(e.clientX, e.clientY);
            const cleanup = (cx, cy) => { stop(cx, cy); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); window.removeEventListener('keydown', onKey); window.removeEventListener('keyup', onKey); };
            const onMove  = (me) => { if (me.buttons === 0) { cleanup(me.clientX, me.clientY); return; } me.preventDefault(); setAltDup(me.altKey); move(me.clientX, me.clientY); };
            const onUp    = (me) => cleanup(me.clientX, me.clientY);
            // Pressing/releasing Opt alone fires no mousemove — track it directly
            const onKey   = (ke) => { if (ke.key === 'Alt') setAltDup(ke.type === 'keydown'); };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            window.addEventListener('keydown', onKey);
            window.addEventListener('keyup', onKey);
        };

        note.addEventListener('touchstart', (e) => {
            if (e.target.closest('.note-resize-handle')) return;
            if (e.target.closest('.note-reaction')) return;
            if (e.target.closest('.video-play-btn')) return;
            if (note.querySelector('.note-edit-ta')) return;
            if (e.target.tagName === 'A') return;
            if (window._lastFileDrop && Date.now() - window._lastFileDrop < 400) return;
            const t = e.touches[0];
            const { move, stop } = startDrag(t.clientX, t.clientY);
            const onMove   = (te) => { te.preventDefault(); const t = te.touches[0]; move(t.clientX, t.clientY); };
            const cleanup  = () => { window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onEnd); window.removeEventListener('touchcancel', onEnd); };
            const onEnd    = (te) => { const t = te.changedTouches[0]; stop(t.clientX, t.clientY); cleanup(); };
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
            window.addEventListener('touchcancel', onEnd);
        }, { passive: true });

        note.oncontextmenu = (e) => {
            e.preventDefault();
            e.stopPropagation();
            openContextMenu(e.clientX, e.clientY, note, data);
        };

        // ---- RESIZE (mousedown + touchstart on handle) ----
        function startResize(clientX, clientY) {
            const startX = clientX;
            const startY = clientY;
            const startRect = note.getBoundingClientRect();
            const startW = Math.ceil(startRect.width);
            const startH = Math.ceil(startRect.height);

            note.style.height = startH + 'px';

            const minW = 20;
            const minH = 20;
            const onMove = (me) => {
                if (me.buttons === 0) { onUp(); return; }
                const newW = Math.max(minW, startW + (me.clientX - startX));
                const newH = Math.max(minH, startH + (me.clientY - startY));
                note.style.width = newW + 'px';
                note.style.height = newH + 'px';
                data.manualResize = true;
                applyResizeClamp(note, data);
            };
            const onTouchMove = (te) => {
                te.preventDefault();
                const t = te.touches[0];
                const newW = Math.max(minW, startW + (t.clientX - startX));
                const newH = Math.max(minH, startH + (t.clientY - startY));
                note.style.width = newW + 'px';
                note.style.height = newH + 'px';
                data.manualResize = true;
                applyResizeClamp(note, data);
            };
            const onUp = () => {
                const endRect = note.getBoundingClientRect();
                data.w = Math.ceil(endRect.width);
                data.h = Math.ceil(endRect.height);
                data.manualResize = true;
                applyResizeClamp(note, data);
                save();
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                window.removeEventListener('touchmove', onTouchMove);
                window.removeEventListener('touchend', onUp);
                window.removeEventListener('touchcancel', onUp);
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onUp);
            window.addEventListener('touchcancel', onUp);
        }

        const rhPath = resizeHandle.querySelector('path');
        rhPath.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            startResize(e.clientX, e.clientY);
        });

        rhPath.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const t = e.touches[0];
            startResize(t.clientX, t.clientY);
        }, { passive: false });

        // ---- DOUBLE CLICK TO EDIT ----
        note.ondblclick = (e) => {
            if (e.target.closest('.note-resize-handle')) return;
            if (e.target.closest('.note-delete')) return;
            if (e.target.closest('.note-timer')) return;
            if (data.imageData) { e.stopPropagation(); return; }
            if (note.classList.contains('editing')) return;
            e.stopPropagation();
            note.classList.add('editing');
            document.body.classList.add('note-editing-mode');
            activeNoteRef = { note, data };

            const ta = document.createElement('textarea');
            ta.className = 'note-edit-ta';
            ta.rows = 1;
            ta.value = data.text || '';
            ta.spellcheck = false;
            content.style.display = 'none';
            note.insertBefore(ta, content);

            // Mirror div to measure natural text width (longest line)
            const mirror = document.createElement('div');
            mirror.style.cssText = 'position:fixed;top:-9999px;left:-9999px;white-space:pre;visibility:hidden;pointer-events:none;';
            const taCs = getComputedStyle(ta);
            mirror.style.fontFamily = taCs.fontFamily;
            mirror.style.fontSize   = taCs.fontSize;
            mirror.style.lineHeight = taCs.lineHeight;
            document.body.appendChild(mirror);

            const NOTE_PAD = 32; // 16px padding each side
            const NOTE_MAX = 568; // max-width 600 - padding
            const NOTE_MIN = 80;

            const taResize = () => {
                if (!data.manualResize) {
                    const lines = (ta.value || ' ').split('\n');
                    let maxW = 0;
                    lines.forEach(line => {
                        mirror.textContent = line || ' ';
                        maxW = Math.max(maxW, mirror.getBoundingClientRect().width);
                    });
                    const edgeMax = Math.max(NOTE_MIN, window.innerWidth - data.x - 16);
                    note.style.width = Math.max(Math.min(Math.ceil(maxW) + NOTE_PAD, NOTE_MAX + NOTE_PAD, edgeMax), NOTE_MIN) + 'px';
                }
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            };
            taResize();
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);

            ta.oninput = () => {
                taResize();
            };

            ta.onkeydown = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); ta.blur(); return; }
                if (e.key === 'Enter') {
                    if (e.shiftKey) {
                        // Shift+Enter: new line (with list continuation)
                        const listMode = ta.value.trimStart().startsWith('→');
                        if (listMode) {
                            e.preventDefault();
                            const pos = ta.selectionStart;
                            const currentLine = ta.value.slice(0, pos).split('\n').pop();
                            const prefix = currentLine.match(/^(→\s*)/) ? currentLine.match(/^(→\s*)/)[1] : '→ ';
                            const insert = '\n' + prefix;
                            ta.value = ta.value.slice(0, pos) + insert + ta.value.slice(ta.selectionEnd);
                            ta.selectionStart = ta.selectionEnd = pos + insert.length;
                            taResize();
                        }
                        // non-list shift+enter: browser default (inserts newline)
                    } else {
                        // Enter alone: finish editing
                        e.preventDefault();
                        ta.blur();
                    }
                }
            };

            ta.onblur = () => {
                mirror.remove();
                if (data._deleted) {
                    document.body.classList.remove('note-editing-mode');
                    activeNoteRef = { note: null, data: null };
                    document.querySelectorAll('.note').forEach(n => n.style.opacity = '');
                    return;
                }
                const plainText = ta.value.trim();
                ta.remove();
                content.style.display = '';
                note.classList.remove('editing');
                requestAnimationFrame(() => applyResizeClamp(note, data));
                document.body.classList.remove('note-editing-mode');
                activeNoteRef = { note: null, data: null };
                data.text = plainText;
                processAlerts(data);
                reconcileTimers(data);
                renderNoteContent(content, data.text, data);
                renderAlertChips(note, data);
                document.querySelectorAll('.note').forEach(n => n.style.opacity = '');
                if (!data.text.trim() && !(data.alerts && data.alerts.length)) {
                    cancelAlertsFor(data);
                    note.remove();
                    notes = notes.filter(n => n.id !== data.id);
                    save();
                    return;
                }
                if (note.classList.contains('spotify-note')) {
                    save();
                    return;
                }
                wrapNote(note, data);
                save();
            };
        };

        if (autoFocus) {
            // Append to DOM first so getBoundingClientRect works, then open editor
            requestAnimationFrame(() => note.ondblclick({ target: note, stopPropagation: () => {}, closest: () => null }));
        }


        
        return note;
    }

    // ---- VIDEO FRAME RECOVERY ON TAB SWITCH ----
    // Primary fix: .note.image-note has backdrop-filter:none to avoid the
    // Chromium/WebKit compositing bug where video layers go blank on tab resume.
    // This handler is a secondary safety net for paused videos that still drop
    // their frame — play()+pause() forces the browser to decode and paint a frame.
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        document.querySelectorAll('.note video').forEach(vid => {
            if (!vid.paused) return;
            const t = vid.currentTime;
            vid.play().then(() => {
                requestAnimationFrame(() => {
                    vid.pause();
                    vid.currentTime = t;
                });
            }).catch(() => {
                // play() blocked (e.g. no user gesture yet) — try a nudge seek
                try { vid.currentTime = t + 0.001; vid.currentTime = t; } catch (_) {}
            });
        });
    });

    // ---- IMAGE DROP FROM FILE SYSTEM ----
    window.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('Files')) e.preventDefault();
    });

    window.addEventListener('drop', (e) => {
        const file = Array.from(e.dataTransfer.files).find(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
        if (!file) return;
        e.preventDefault();

        const reader = new FileReader();

        // Show upload progress indicator for videos
        let uploadIndicator = null;
        if (file.type.startsWith('video/')) {
            uploadIndicator = document.createElement('div');
            uploadIndicator.className = 'video-upload-indicator';
            uploadIndicator.innerHTML = `
                <div class="vui-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    Reading video…
                </div>
                <div class="vui-track"><div class="vui-bar" id="vui-bar-active"></div></div>`;
            const indicatorW = 180;
            const indicatorH = 60;
            uploadIndicator.style.left = Math.min(e.clientX - indicatorW / 2, window.innerWidth - indicatorW - 16) + 'px';
            uploadIndicator.style.top  = Math.min(e.clientY - indicatorH / 2, window.innerHeight - indicatorH - 16) + 'px';
            document.body.appendChild(uploadIndicator);

            reader.onprogress = (pe) => {
                if (!pe.lengthComputable) return;
                const bar = uploadIndicator.querySelector('.vui-bar');
                if (bar) bar.style.width = Math.round((pe.loaded / pe.total) * 100) + '%';
            };
        }

        const removeIndicator = () => {
            if (!uploadIndicator) return;
            const bar = uploadIndicator.querySelector('.vui-bar');
            if (bar) bar.style.width = '100%';
            uploadIndicator.classList.add('done');
            uploadIndicator.addEventListener('animationend', () => uploadIndicator.remove(), { once: true });
            uploadIndicator = null;
        };

        reader.onload = (ev) => {
            if (file.type.startsWith('video/')) {
                const vid = document.createElement('video');
                vid.onerror = removeIndicator;
                vid.onloadedmetadata = () => {
                    removeIndicator();
                    const maxW = 320, maxH = 320;
                    let w = vid.videoWidth, h = vid.videoHeight;
                    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                    if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
                    const data = {
                        id: 'n' + Date.now(),
                        x: Math.round(e.clientX - w / 2),
                        y: Math.round(e.clientY - h / 2),
                        text: '',
                        imageData: ev.target.result,
                        w, h,
                        manualResize: true,
                        zIndex: ++topZ,
                        page: currentPage,
                        createdAt: Date.now()
                    };
                    notes.push(data);
                    window._lastFileDrop = Date.now();
                    createNote(data);
                    save();
                };
                vid.src = ev.target.result;
            } else {
                const tempImg = new Image();
                tempImg.onload = () => {
                    const maxW = 320, maxH = 320;
                    let w = tempImg.naturalWidth, h = tempImg.naturalHeight;
                    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                    if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
                    const data = {
                        id: 'n' + Date.now(),
                        x: Math.round(e.clientX - w / 2),
                        y: Math.round(e.clientY - h / 2),
                        text: '',
                        imageData: ev.target.result,
                        w, h,
                        manualResize: true,
                        zIndex: ++topZ,
                        page: currentPage,
                        createdAt: Date.now()
                    };
                    notes.push(data);
                    window._lastFileDrop = Date.now();
                    createNote(data);
                    save();
                };
                tempImg.src = ev.target.result;
            }
        };
        reader.readAsDataURL(file);
    });

    function spawnNote(x, y, target) {
        if (
            !target.closest('.note') &&
            !target.closest('.note-context-menu') &&
            !target.closest('.settings-panel') &&
            !target.closest('.settings-btn') &&
            !target.closest('.note-arrow-bar') &&
            !target.closest('.search-overlay') &&
            !target.closest('.dev-modal') &&
            !target.closest('.page-dots') &&
            target.tagName !== 'BUTTON' &&
            target.tagName !== 'INPUT' &&
            target.tagName !== 'A'
        ) {
            const n = {
                id: 'n' + Date.now(),
                x: x - 40,
                y: y - 30,
                text: '',
                zIndex: ++topZ,
                page: currentPage,
                createdAt: Date.now()
            };
            notes.push(n);
            createNote(n, true);
        }
    }

    window.addEventListener('dblclick', (e) => spawnNote(e.clientX, e.clientY, e.target));

    // Double-tap to create note on touch devices
    let lastTap = 0, lastTapTarget = null;
    window.addEventListener('touchend', (e) => {
        const now = Date.now();
        const t = e.changedTouches[0];
        if (now - lastTap < 300 && lastTapTarget === e.target) {
            spawnNote(t.clientX, t.clientY, e.target);
            lastTap = 0;
        } else {
            lastTap = now;
            lastTapTarget = e.target;
        }
    });

    // Escape key: exit note editing as if you clicked away
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            const active = document.querySelector('.note-edit-ta');
            if (active) active.blur();
            if (document.body.classList.contains('screenshot-mode')) {
                document.body.classList.remove('screenshot-mode');
            }
            return;
        }

        // Option+D — dev mode
        if (e.altKey && (e.key.toLowerCase() === 'd' || e.key === '∂')) {
            e.preventDefault();
            document.body.classList.toggle('dev-mode');
            return;
        }

        // Direct typing — create note and start typing
        if (
            e.key.length === 1 &&
            !e.ctrlKey &&
            !e.metaKey &&
            !e.altKey &&
            !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) &&
            document.activeElement.contentEditable !== 'true' &&
            !document.body.classList.contains('screenshot-mode') &&
            !document.getElementById('settings-panel')?.classList.contains('show') &&
            !document.getElementById('dev-modal')?.classList.contains('open') &&
            !document.getElementById('delete-confirm-modal')?.classList.contains('open') &&
            !document.getElementById('search-overlay')?.classList.contains('show')
        ) {
            e.preventDefault();
            const cx = mousePos.x || window.innerWidth / 2;
            const cy = mousePos.y || window.innerHeight / 2;
            const n = {
                id: 'n' + Date.now(),
                x: cx - 60,
                y: cy - 30,
                text: '',
                zIndex: ++topZ,
                page: currentPage,
                createdAt: Date.now()
            };
            notes.push(n);
            const noteEl = createNote(n, true);
            
            // Insert the typed character after edit mode opens
            requestAnimationFrame(() => {
                const ta = noteEl.querySelector('.note-edit-ta');
                if (ta) {
                    ta.value = e.key;
                    ta.dispatchEvent(new Event('input'));
                    ta.selectionStart = ta.selectionEnd = ta.value.length;
                    ta.focus();
                }
            });
        }
    });

    /* ============================================================
       NOTE ALERTS — slash-command reminders
    ============================================================ */
    const scheduledTimers = new Map();
    const MAX_SETTIMEOUT = 24 * 24 * 60 * 60 * 1000;

    let alertAudioCtx = null;
    function playAlertChime() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!alertAudioCtx) alertAudioCtx = new Ctx();
        if (alertAudioCtx.state === 'suspended') alertAudioCtx.resume().catch(() => {});
        const ctx = alertAudioCtx;
        const t0 = ctx.currentTime;
        [880, 1320].forEach((freq, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.value = freq;
            const start = t0 + i * 0.18;
            g.gain.setValueAtTime(0, start);
            g.gain.linearRampToValueAtTime(0.18, start + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0008, start + 0.55);
            o.connect(g).connect(ctx.destination);
            o.start(start);
            o.stop(start + 0.6);
        });
    }

    function makeAlertId() {
        return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function parseHourSpec(h, ap) {
        h = parseInt(h, 10);
        if (!ap) return h;
        const pm = ap.toLowerCase() === 'pm';
        if (pm && h < 12) h += 12;
        if (!pm && h === 12) h = 0;
        return h;
    }

    function parseAlertsFromText(text) {
        const alerts = [];

        // /everyday at 6am [message...]  (recurring)
        text = text.replace(
            /(^|\s)\/everyday\s+at\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b([^\n]*)/gi,
            (_, pre, h, mm, ap, rest) => {
                alerts.push({
                    id: makeAlertId(), kind: 'daily',
                    hour: parseHourSpec(h, ap),
                    minute: mm ? parseInt(mm, 10) : 0,
                    text: rest.trim() || undefined
                });
                return pre;
            }
        );

        // /6am, /6:30am, /6pm tomorrow
        text = text.replace(
            /(^|\s)\/(\d{1,2})(?::(\d{2}))?(am|pm)\b(\s+tomorrow\b)?/gi,
            (_, pre, h, mm, ap, tom) => {
                const hour = parseHourSpec(h, ap);
                const minute = mm ? parseInt(mm, 10) : 0;
                const d = new Date();
                d.setHours(hour, minute, 0, 0);
                if (tom || d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
                alerts.push({ id: makeAlertId(), kind: 'once', at: d.getTime() });
                return pre;
            }
        );

        // Note: bare durations (/5, /10m, /45s, /2h) are handled separately as
        // live inline timers (see reconcileTimers) and are NOT stripped here.

        text = text.replace(/[ \t]+\n/g, '\n').replace(/\n[ \t]+/g, '\n').replace(/[ \t]{2,}/g, ' ').trim();
        return { text, alerts };
    }

    function nextDailyAt(hour, minute) {
        const d = new Date();
        d.setHours(hour, minute || 0, 0, 0);
        if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
        return d.getTime();
    }

    function cancelAlertById(id) {
        const tid = scheduledTimers.get(id);
        if (tid) { clearTimeout(tid); scheduledTimers.delete(id); }
    }

    function cancelAlertsFor(noteData) {
        (noteData.alerts || []).forEach(a => cancelAlertById(a.id));
        (noteData.timers || []).forEach(t => cancelAlertById(t.id));
    }

    function fireAlert(noteData, alert) {
        const noteText = (noteData.text || '').trim();
        const detail = (alert.text || noteText.split('\n')[0] || '').trim();
        const body = detail ? detail : (noteText || 'Reminder');
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try {
                new Notification('Week Dash Reminder', {
                    body,
                    icon: 'img/favicon-192.png',
                    badge: 'img/favicon-64.png',
                    tag: 'wd-' + alert.id
                });
            } catch (_) {}
        }
        playAlertChime();
        if (alert.kind === 'daily') {
            scheduleAlert(noteData, alert);
        } else {
            noteData.alerts = (noteData.alerts || []).filter(a => a.id !== alert.id);
            const el = document.getElementById(noteData.id);
            if (el) renderAlertChips(el, noteData);
            save();
        }
    }

    function scheduleAlert(noteData, alert) {
        cancelAlertById(alert.id);
        const target = alert.kind === 'daily' ? nextDailyAt(alert.hour, alert.minute) : alert.at;
        const delay = target - Date.now();
        if (delay <= 0) {
            fireAlert(noteData, alert);
            return;
        }
        const safe = Math.min(delay, MAX_SETTIMEOUT);
        const tid = setTimeout(() => {
            scheduledTimers.delete(alert.id);
            if (safe < delay) scheduleAlert(noteData, alert);
            else              fireAlert(noteData, alert);
        }, safe);
        scheduledTimers.set(alert.id, tid);
    }

    function ensureNotifPermission() {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'default') {
            Notification.requestPermission().catch(() => {});
        }
    }

    function processAlerts(noteData) {
        const { text, alerts } = parseAlertsFromText(noteData.text || '');
        if (!alerts.length) return;
        noteData.text = text;
        noteData.alerts = (noteData.alerts || []).concat(alerts);
        ensureNotifPermission();
        alerts.forEach(a => scheduleAlert(noteData, a));
    }

    function formatTime12(h, m) {
        const ap = h >= 12 ? 'pm' : 'am';
        let h12 = h % 12; if (h12 === 0) h12 = 12;
        return h12 + ':' + String(m).padStart(2, '0') + ap;
    }

    function describeAlert(a) {
        if (a.kind === 'daily') {
            return 'daily ' + formatTime12(a.hour, a.minute || 0)
                + (a.text ? ' • ' + a.text.slice(0, 24) : '');
        }
        const ms = a.at - Date.now();
        if (ms <= 0)        return 'now';
        if (ms < 60000)     return Math.round(ms / 1000) + 's';
        if (ms < 3600000)   return Math.round(ms / 60000) + 'm';
        if (ms < 86400000)  return new Date(a.at).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
        return new Date(a.at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    }

    function renderAlertChips(noteEl, noteData) {
        let dock = noteEl.querySelector('.note-alerts');
        const list = noteData.alerts || [];
        if (!list.length) {
            if (dock) dock.remove();
            return;
        }
        if (!dock) {
            dock = document.createElement('div');
            dock.className = 'note-alerts';
            noteEl.appendChild(dock);
        }
        dock.innerHTML = '';
        list.forEach(a => {
            const chip = document.createElement('span');
            chip.className = 'note-alert-chip';
            const icon = document.createElement('span');
            icon.className = 'note-alert-icon';
            icon.textContent = '⏰';
            const lbl = document.createElement('span');
            lbl.className = 'note-alert-text';
            lbl.textContent = describeAlert(a);
            chip.appendChild(icon);
            chip.appendChild(lbl);
            const x = document.createElement('button');
            x.className = 'note-alert-x';
            x.type = 'button';
            x.textContent = '×';
            x.title = 'Remove alert';
            x.addEventListener('mousedown', e => e.stopPropagation());
            x.addEventListener('click', e => {
                e.stopPropagation();
                cancelAlertById(a.id);
                noteData.alerts = (noteData.alerts || []).filter(al => al.id !== a.id);
                renderAlertChips(noteEl, noteData);
                save();
            });
            chip.appendChild(x);
            dock.appendChild(chip);
        });
    }

    /* ============================================================
       LIVE TIMERS — inline /10m countdowns with play/pause
    ============================================================ */
    // A /duration token stays literally in the note text; its runtime state
    // (running/paused/done + endAt) lives in noteData.timers, aligned by order.
    function timerTokenRe() {
        return /(?<=^|\s)\/(\d+)(sec|s|min|m|hr|h)?(?=\s|$)/gi;
    }
    function durFromMatch(n, u) {
        n = parseInt(n, 10);
        u = (u || '').toLowerCase();
        if (u === 'sec' || u === 's') return n * 1000;
        if (u === 'hr'  || u === 'h') return n * 3600000;
        return n * 60000; // m, min, or bare number → minutes
    }
    function parseTimerDurs(text) {
        const out = [], re = timerTokenRe();
        let m;
        while ((m = re.exec(text))) out.push(durFromMatch(m[1], m[2]));
        return out;
    }
    function fmtClock(ms) {
        const s = Math.max(0, Math.ceil(ms / 1000));
        const h = Math.floor(s / 3600);
        const mm = Math.floor((s % 3600) / 60);
        return h + ':' + String(mm).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    const TIMER_PAUSE  = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
    const TIMER_PLAY   = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const TIMER_REPLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V2L7 7l5 5V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-7z"/></svg>`;

    let timerTick = null;
    function ensureTimerTick() {
        if (timerTick) return;
        timerTick = setInterval(() => {
            document.querySelectorAll('.note-timer[data-running="1"]').forEach(el => {
                const time = el.querySelector('.note-timer-time');
                if (time) time.textContent = fmtClock((+el.dataset.end) - Date.now());
            });
        }, 1000);
    }

    function applyTimerState(span, t) {
        const glyph = span.querySelector('.note-timer-glyph');
        const time  = span.querySelector('.note-timer-time');
        if (t.done) {
            glyph.innerHTML = TIMER_REPLAY;
            time.textContent = '0:00:00';
            delete span.dataset.running;
            span.classList.add('done');
            span.title = 'Restart timer';
        } else if (t.running) {
            glyph.innerHTML = TIMER_PAUSE;
            span.dataset.running = '1';
            span.dataset.end = t.endAt;
            time.textContent = fmtClock(t.endAt - Date.now());
            span.classList.remove('done');
            span.title = 'Pause timer';
        } else {
            glyph.innerHTML = TIMER_PLAY;
            delete span.dataset.running;
            time.textContent = fmtClock(t.remaining || 0);
            span.classList.remove('done');
            span.title = 'Resume timer';
        }
    }

    function makeTimerEl(t) {
        const span = document.createElement('span');
        span.className = 'note-timer';
        span.dataset.tid = t.id;
        span.appendChild(Object.assign(document.createElement('span'), { className: 'note-timer-glyph' }));
        span.appendChild(Object.assign(document.createElement('span'), { className: 'note-timer-time' }));
        applyTimerState(span, t);
        span.addEventListener('mousedown', e => e.stopPropagation());
        span.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); onTimerClick(t.id); });
        return span;
    }

    function refreshTimerEls(t) {
        document.querySelectorAll('.note-timer[data-tid="' + CSS.escape(t.id) + '"]')
            .forEach(el => applyTimerState(el, t));
    }

    function fireTimer(noteData, t) {
        t.running = false; t.done = true; t.remaining = 0; delete t.endAt;
        const body = (noteData.text || '').replace(timerTokenRe(), '').replace(/\s+/g, ' ').trim() || 'Timer done';
        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try {
                new Notification('Week Dash Reminder', {
                    body, icon: 'img/favicon-192.png', badge: 'img/favicon-64.png', tag: 'wd-' + t.id
                });
            } catch (_) {}
        }
        playAlertChime();
        refreshTimerEls(t);
        save();
    }

    function scheduleTimer(noteData, t) {
        cancelAlertById(t.id);
        if (!t.running || t.done) return;
        const delay = t.endAt - Date.now();
        if (delay <= 0) { fireTimer(noteData, t); return; }
        const safe = Math.min(delay, MAX_SETTIMEOUT);
        const tid = setTimeout(() => {
            scheduledTimers.delete(t.id);
            if (safe < delay) scheduleTimer(noteData, t);
            else              fireTimer(noteData, t);
        }, safe);
        scheduledTimers.set(t.id, tid);
    }

    function onTimerClick(id) {
        let noteData = null, t = null;
        for (const n of notes) {
            const f = (n.timers || []).find(x => x.id === id);
            if (f) { noteData = n; t = f; break; }
        }
        if (!t) return;
        if (t.done) {                              // replay
            t.done = false; t.running = true; t.endAt = Date.now() + t.durMs; delete t.remaining;
            ensureNotifPermission(); scheduleTimer(noteData, t);
        } else if (t.running) {                    // pause
            t.remaining = Math.max(0, t.endAt - Date.now()); t.running = false; delete t.endAt;
            cancelAlertById(t.id);
        } else {                                   // resume
            t.running = true; t.endAt = Date.now() + (t.remaining || 0); delete t.remaining;
            scheduleTimer(noteData, t);
        }
        refreshTimerEls(t);
        ensureTimerTick();
        save();
    }

    // Keep noteData.timers aligned (by order) with the /duration tokens in the text.
    // Unchanged tokens keep their running state; new ones auto-start.
    function reconcileTimers(noteData) {
        const durs = parseTimerDurs(noteData.text || '');
        const old = noteData.timers || [];
        const next = [];
        for (let i = 0; i < durs.length; i++) {
            const prev = old[i];
            if (prev && prev.durMs === durs[i]) next.push(prev);
            else next.push({ id: makeAlertId(), durMs: durs[i], running: true, endAt: Date.now() + durs[i] });
        }
        old.forEach(o => { if (next.indexOf(o) === -1) cancelAlertById(o.id); });
        if (next.length) noteData.timers = next;
        else delete noteData.timers;
        let anyRunning = false;
        next.forEach(t => { if (t.running && !t.done) { anyRunning = true; scheduleTimer(noteData, t); } });
        if (anyRunning) { ensureNotifPermission(); ensureTimerTick(); }
    }

    // Serialized saves: each write runs after the previous one, so concurrent
    // edits can never clobber each other or lose the last state.
    let saveQueue = Promise.resolve();
    function save() {
        saveQueue = saveQueue.then(doSave).catch(err => console.error('save failed:', err));
        return saveQueue;
    }
    async function doSave() {
        document.querySelectorAll('.note').forEach(el => {
            const d = notes.find(x => x.id === el.id);
            if (d) {
                // Skip hidden notes (other pages) — their rect is 0
                if (el.style.display === 'none') return;
                d.x = parseInt(el.style.left);
                d.y = parseInt(el.style.top);
                if (d.manualResize) {
                    const rect = el.getBoundingClientRect();
                    d.w = Math.ceil(rect.width);
                    d.h = Math.ceil(rect.height);
                }
                d.zIndex = el.style.zIndex;
            }
        });
        // Store media blobs in IndexedDB, keep only the ref key in memory.
        // If the blob write fails, keep the data URL in the note so the media
        // isn't lost — only swap to the ref key once it's actually stored.
        const toSave = await Promise.all(notes.map(async n => {
            if (n.imageData && typeof n.imageData === 'string' && n.imageData.startsWith('data:')) {
                const key = 'media_' + n.id;
                const ok = await mediaDB.put(key, n.imageData);
                if (ok) {
                    n.imageData = key;
                    return { ...n, imageData: key };
                }
                return n;
            }
            return n;
        }));
        await mediaDB.put('notes', toSave);
    }

    /* ============================================================
       MISC
    ============================================================ */
    function clearNotes() {
        notes.forEach(n => { if (n.imageData) mediaDB.del('media_' + n.id); });
        document.querySelectorAll('.note').forEach(n => n.remove());
        notes = [];
        mediaDB.del('notes');
    }

    // Track which note is being edited for the color bar
    let activeNoteRef = { note: null, data: null };

    // Dev mode — activate with ?dev in URL or Shift+F
    if (location.search.includes('dev')) {
        document.body.classList.add('dev-mode');
    }
    const devBtn    = document.getElementById('dev-export-btn');
    const devModal  = document.getElementById('dev-modal');
    const devOutput = document.getElementById('dev-modal-output');
    const devCopy   = document.getElementById('dev-modal-copy');
    const devClose  = document.getElementById('dev-modal-close');

    devBtn.addEventListener('click', () => {
        const snapshot = notes.filter(d => (d.page || 0) === currentPage).map(d => {
            const el = document.getElementById(d.id);
            const rect = el ? el.getBoundingClientRect() : null;
            return {
                id: d.id,
                x: Math.round(d.x),
                y: Math.round(d.y),
                w: rect ? Math.round(rect.width) : d.w,
                ...(d.h ? { h: d.h } : {}),
                ...(d.manualResize ? { manualResize: true } : {}),
                text: d.text,
                ...(d.color && d.color !== 'default' ? { color: d.color } : {}),
                ...(d.imageData ? { hasImage: true } : {}),
            };
        });
        devOutput.value = JSON.stringify(snapshot, null, 4);
        devModal.classList.add('open');
    });
    devCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(devOutput.value);
        devCopy.textContent = 'copied!';
        setTimeout(() => devCopy.textContent = 'copy', 1500);
    });
    devClose.addEventListener('click', () => devModal.classList.remove('open'));
    devModal.addEventListener('click', e => { if (e.target === devModal) devModal.classList.remove('open'); });





</script>
<script>
// Init — paint UI immediately, defer network calls
    appReady.then(() => {
    applyLang(lang);
    // Hydrate media from IndexedDB, then create notes
    (async function() {
        for (const n of notes.filter(n => !n.archived)) {
            if (n.imageData && typeof n.imageData === 'string' && n.imageData.startsWith('media_')) {
                const blob = await mediaDB.get(n.imageData);
                if (blob) {
                    n.imageData = blob;
                }
            }
            createNote(n);
            if (n.alerts && n.alerts.length) {
                n.alerts.forEach(a => scheduleAlert(n, a));
            }
            // Hide notes not on current page
            if (n.page !== currentPage) {
                const el = document.getElementById(n.id);
                if (el) el.style.display = 'none';
            }
        }
    })();

/* ============================================================
       SETTINGS PANEL
    ============================================================ */
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');

    function toggleSettings(forceOpen) {
        const willOpen = forceOpen !== undefined ? forceOpen : !settingsPanel.classList.contains('show');
        settingsPanel.classList.toggle('show', willOpen);
        settingsBtn.classList.toggle('open', willOpen);
    }

    settingsBtn.addEventListener('click', () => toggleSettings());

    // Close settings on click outside
    document.addEventListener('mousedown', (e) => {
        if (settingsPanel.classList.contains('show') &&
            !settingsPanel.contains(e.target) &&
            !settingsBtn.contains(e.target)) {
            toggleSettings(false);
        }
    });

    // Custom background — import / reset (IndexedDB-backed)
    const bgImportBtn = document.getElementById('bg-import-btn');
    const bgResetBtn  = document.getElementById('bg-reset-btn');
    const bgFileInput = document.getElementById('bg-file-input');

    // Minimal IndexedDB helpers — single store keyed by string
    const IDB_NAME = 'aura', IDB_STORE = 'prefs', IDB_KEY = 'customBg';
    function openIdb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror   = () => reject(req.error);
        });
    }
    function idbGet(key) {
        return openIdb().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const r  = tx.objectStore(IDB_STORE).get(key);
            r.onsuccess = () => resolve(r.result);
            r.onerror   = () => reject(r.error);
        }));
    }
    function idbPut(key, value) {
        return openIdb().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(value, key);
            tx.oncomplete = () => resolve();
            tx.onerror    = () => reject(tx.error);
        }));
    }
    function idbDel(key) {
        return openIdb().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror    = () => reject(tx.error);
        }));
    }

    const bgVideoEl = document.getElementById('custom-bg-video');
    let customBgUrl = null; // active object URL, kept for revocation
    function applyCustomBgBlob(blob) {
        const url = URL.createObjectURL(blob);
        if (customBgUrl && customBgUrl !== url) URL.revokeObjectURL(customBgUrl);
        customBgUrl = url;
        const isVideo = (blob.type || '').startsWith('video/');
        if (isVideo) {
            document.documentElement.classList.add('has-custom-bg-video');
            document.documentElement.style.backgroundImage = 'none';
            bgVideoEl.src = url;
            // Best-effort autoplay; muted+playsinline keep this allowed in modern browsers.
            const p = bgVideoEl.play();
            if (p && p.catch) p.catch(() => {});
        } else {
            document.documentElement.classList.remove('has-custom-bg-video');
            bgVideoEl.removeAttribute('src');
            bgVideoEl.load();
            document.documentElement.style.backgroundImage = `url("${url}")`;
        }
        setSetting('custom_bg_kind', isVideo ? 'video' : 'image');
        bgResetBtn.disabled = false;
    }
    function clearCustomBgUrl() {
        if (customBgUrl) { URL.revokeObjectURL(customBgUrl); customBgUrl = null; }
        document.documentElement.classList.remove('has-custom-bg-video');
        bgVideoEl.removeAttribute('src');
        bgVideoEl.load();
        document.documentElement.style.backgroundImage = ''; // restore default wallpaper
        mediaDB.del('settings_custom_bg_kind');
        cacheRemove('custom_bg_kind');
        bgResetBtn.disabled = true;
    }

    // One-time migration: old data URL in localStorage → Blob in IndexedDB
    async function migrateLegacyCustomBg() {
        const old = localStorage.getItem('aura_custom_bg');
        if (!old) return;
        try {
            const comma = old.indexOf(',');
            const meta  = old.slice(0, comma);
            const b64   = old.slice(comma + 1);
            const mime  = (meta.match(/data:([^;]+)/) || [])[1] || 'image/png';
            const bin   = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            await idbPut(IDB_KEY, new Blob([bytes], { type: mime }));
            setSetting('has_custom_bg', '1');
        } catch (_) { /* malformed — drop it */ }
        localStorage.removeItem('aura_custom_bg');
    }

    async function initCustomBg() {
        await migrateLegacyCustomBg();
        try {
            const blob = await idbGet(IDB_KEY);
            if (blob instanceof Blob) {
                setSetting('has_custom_bg', '1');
                applyCustomBgBlob(blob);
            } else {
                // No saved bg — make sure the default wallpaper is visible
                // (pre-paint may have hidden it via the flag from a stale state)
                mediaDB.del('settings_has_custom_bg');
                cacheRemove('has_custom_bg');
                clearCustomBgUrl();
            }
        } catch (_) {
            mediaDB.del('settings_has_custom_bg');
            cacheRemove('has_custom_bg');
            clearCustomBgUrl();
        }
    }
    initCustomBg();

    bgImportBtn.addEventListener('click', () => bgFileInput.click());

    bgFileInput.addEventListener('change', async () => {
        const file = bgFileInput.files && bgFileInput.files[0];
        bgFileInput.value = ''; // allow re-picking the same file later
        if (!file) return;
        const isImage = file.type.startsWith('image/');
        const isVideo = file.type.startsWith('video/');
        if (!isImage && !isVideo) {
            alert('Please choose an image or video file.');
            return;
        }
        try {
            // Drop the previous blob first so the browser can reclaim its disk
            // space immediately rather than waiting for the put to overwrite.
            try { await idbDel(IDB_KEY); } catch (_) {}
            await idbPut(IDB_KEY, file); // File is a Blob, store as-is
            setSetting('has_custom_bg', '1');
            applyCustomBgBlob(file);
        } catch (err) {
            console.error(err);
            alert(isVideo ? 'Could not save that video.' : 'Could not save that image.');
        }
    });

    bgResetBtn.addEventListener('click', async () => {
        try {
            await idbDel(IDB_KEY); // delete the blob from IndexedDB
        } catch (err) {
            console.error(err);
        }
        mediaDB.del('settings_has_custom_bg');
        cacheRemove('has_custom_bg');
        clearCustomBgUrl();
    });

    function reflowNotes() {
        document.querySelectorAll('.note').forEach(el => {
            const data = notes.find(n => n.id === el.id);
            if (!data || data.imageData) return;
            // Always clear fixed height so text doesn't overflow
            el.style.height = '';
            delete data.h;
            if (data.manualResize) return; // preserve user-chosen width
            delete data.w;
            el.style.width = '';
            wrapNote(el, data);
        });
        save();
    }


    // Text size
    function applyNoteSize(size, noReflow = false) {
        if (size !== 'S' && size !== 'M' && size !== 'L') return;
        noteSize = size;
        document.documentElement.style.setProperty('--note-size', `var(--note-size-${size})`);
        document.querySelectorAll('#text-size-toggle .settings-toggle-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.size === size);
        });
        setSetting('note_size', size);
        if (!noReflow) reflowNotes();
    }

    document.getElementById('text-size-toggle').addEventListener('click', (e) => {
        const btn = e.target.closest('.settings-toggle-btn');
        if (!btn) return;
        applyNoteSize(btn.dataset.size);
    });

    // Always apply valley theme
    document.documentElement.classList.add('theme-valley');

    // Restore saved settings (loaded from IndexedDB during boot)
    applyNoteSize(noteSize, true);

    // Reveal body — wait for fonts then show immediately
    (function revealWhenReady() {
        const show = () => document.body.classList.add('ready');
        document.fonts.ready.then(() => requestAnimationFrame(show));
        setTimeout(show, 300); // fallback
    })();

    // Snap note widths once fonts are loaded so they're stable across refreshes
    document.fonts.ready.then(() => {
        document.querySelectorAll('.note').forEach(el => {
            const data = notes.find(n => n.id === el.id);
            if (!data || data.imageData || data.manualResize) return;
            wrapNote(el, data);
        });
        save();
    });


    /* ── Portugal holidays & events (date key: 'YYYY-MM-DD') ── */
    const PT_EVENTS = {
        // Fixed holidays
        '01-01': { label: 'Ano Novo',         color: '#ff6b6b' },
        '01-06': { label: 'Dia de Reis',       color: '#f472b6' },
        '04-25': { label: 'Dia da Liberdade',  color: '#34d399' },
        '05-01': { label: 'Dia do Trabalhador', color: '#f472b6' },
        '06-10': { label: 'Dia de Portugal',   color: '#34d399' },
        '08-15': { label: 'Assunção',          color: '#fbbf24' },
        '10-05': { label: 'Implantação Rep.',  color: '#34d399' },
        '11-01': { label: 'Todos os Santos',   color: '#60a5fa' },
        '12-08': { label: 'Imaculada Conc.',   color: '#f472b6' },
        '12-24': { label: 'Noite de Natal',    color: '#fbbf24' },
        '12-25': { label: 'Natal',             color: '#ff6b6b' },
        '12-31': { label: 'Véspera de Ano Novo', color: '#f472b6' },
        // Variable — added dynamically by computePTEvent()
    };

    /* Compute movable Portuguese holidays for a given year */
    function getPTHolidays(year) {
        const holidays = {};

        // Easter (Computus)
        const easter = computeEaster(year);
        const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
        const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

        holidays[fmt(easter)]                    = { label: 'Páscoa',         color: '#f5b942' };
        holidays[fmt(addDays(easter, -2))]        = { label: 'Sexta-feira Santa', color: '#fbbf24' };
        holidays[fmt(addDays(easter, -47))]       = { label: 'Carnaval',         color: '#f472b6' };
        holidays[fmt(addDays(easter, -46))]       = { label: 'Carnaval',         color: '#f472b6' };
        holidays[fmt(addDays(easter, 60))]        = { label: 'Corpo de Deus',   color: '#f5b942' };

        return holidays;
    }

    /* Computus — calculate Easter Sunday for a given year (valid 1582–4099) */
    function computeEaster(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
    }

    /* Get event for a Date object (checks year-specific + fixed) */
    function getEventForDate(date) {
        const year = date.getFullYear();
        const fixed = PT_EVENTS;
        const fixedKey = `${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        if (fixed[fixedKey]) return fixed[fixedKey];
        // Cache per-year holidays
        if (!window._ptHolidays) window._ptHolidays = {};
        if (!window._ptHolidays[year]) window._ptHolidays[year] = getPTHolidays(year);
        const key = `${year}-${fixedKey}`;
        return window._ptHolidays[year][key] || null;
    }

    /* ── Minidock — 7-day week (Mon → Sun) + upcoming events, top center ── */
    (function setupMinidock() {
        const dock = document.createElement('div');
        dock.className = 'minidock';
        dock.setAttribute('aria-label', 'Current week');
        document.body.appendChild(dock);

        const dayLabel = document.createElement('div');
        dayLabel.className = 'minidock-day-label';
        document.body.appendChild(dayLabel);

        // Tooltip element
        const tooltip = document.createElement('div');
        tooltip.className = 'minidock-tooltip';
        tooltip.setAttribute('role', 'tooltip');
        tooltip.setAttribute('aria-live', 'polite');
        document.body.appendChild(tooltip);

        let builtKey = '';
        const dayKey = () => {
            const n = new Date();
            return `${n.getFullYear()}-${n.getMonth()}-${n.getDate()}`;
        };

        function build() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const locale = (typeof lang !== 'undefined' && lang === 'es') ? 'es-ES'
                         : (typeof lang !== 'undefined' && lang === 'pt') ? 'pt-BR' : 'en-US';
            const fmtWd = (date) => date.toLocaleDateString(locale, { weekday: 'narrow' }).toUpperCase();

            dayLabel.textContent = now.toLocaleDateString(locale, { weekday: 'long' });

            dock.innerHTML = '';
            const dow = today.getDay();
            const startOffset = -(dow === 0 ? 6 : dow - 1);

            // ── Main week: 7 days ──
            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() + startOffset + i);
                const el = document.createElement('div');
                el.className = 'minidock-day';

                const numWrap = document.createElement('div');
                numWrap.className = 'minidock-day-num-wrap';

                const wd = document.createElement('span');
                wd.className = 'minidock-day-wd';
                wd.textContent = fmtWd(date);

                const num = document.createElement('span');
                num.className = 'minidock-day-num';
                num.textContent = date.getDate();

                numWrap.appendChild(num);
                el.appendChild(wd);
                el.appendChild(numWrap);

                // Event dot
                const ev = getEventForDate(date);
                if (ev) {
                    const dot = document.createElement('span');
                    dot.className = 'minidock-day-dot';
                    dot.style.background = ev.color;
                    numWrap.appendChild(dot);

                    el.addEventListener('mouseenter', () => {
                        const rect = el.getBoundingClientRect();
                        tooltip.textContent = '';
                        const dateLine = document.createElement('div');
                        dateLine.className = 'minidock-tooltip-date';
                        dateLine.textContent = date.toLocaleDateString(locale, { day: 'numeric', month: 'long' });
                        const labelLine = document.createElement('div');
                        labelLine.textContent = ev.label;
                        tooltip.appendChild(dateLine);
                        tooltip.appendChild(labelLine);

                        let top = rect.bottom + 6;
                        let left = rect.left + rect.width / 2;
                        const tw = 180;
                        left = Math.min(Math.max(left - tw/2, 8), window.innerWidth - tw - 8);
                        if (top + 60 > window.innerHeight) top = rect.top - 66;
                        tooltip.style.top = top + 'px';
                        tooltip.style.left = left + 'px';
                        tooltip.style.transform = 'translateY(0) scale(1)';
                        tooltip.classList.add('visible');
                    });
                    el.addEventListener('mouseleave', () => {
                        tooltip.classList.remove('visible');
                    });
                }

                if (date.getTime() === today.getTime()) {
                    el.classList.add('is-today');
                } else {
                    const dist = Math.abs(startOffset + i);
                    const tone = Math.max(0.24, 0.82 - (dist - 1) * 0.12);
                    el.style.color = `rgba(255, 255, 255, ${tone.toFixed(3)})`;
                }
                dock.appendChild(el);
            }



            builtKey = dayKey();
            requestAnimationFrame(() => {
                dock.classList.add('ready');
                dayLabel.classList.add('ready');
            });
        }
        window.updateMinidockLang = build;

        function rebuildIfDateChanged() {
            if (dayKey() !== builtKey) build();
        }

        build();

        function scheduleMidnight() {
            const now = new Date();
            const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
            setTimeout(() => { rebuildIfDateChanged(); scheduleMidnight(); }, next - now);
        }
        scheduleMidnight();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) rebuildIfDateChanged(); });
        window.addEventListener('focus', rebuildIfDateChanged);
        setInterval(rebuildIfDateChanged, 60000);
    })();

    /* ── Year progress — frosted chips per month ── */
    (function setupYearBar() {
        const bar = document.createElement('div');
        bar.className = 'year-bar';
        bar.setAttribute('aria-label', 'Year progress');
        document.body.appendChild(bar);

        const MONTH_NAMES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

        function build() {
            const now = new Date();
            const year = now.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const endOfYear   = new Date(year, 11, 31);
            const totalDays   = (endOfYear - startOfYear) / 86400000 + 1;
            const dayOfYear   = (now - startOfYear) / 86400000 + 1;

            bar.innerHTML = '';
            MONTH_NAMES.forEach((name, i) => {
                const monthEnd   = new Date(year, i + 1, 0);
                const monthLen   = monthEnd.getDate();
                const daysToMonthEnd = (monthEnd - startOfYear) / 86400000 + 1;
                const monthPct = Math.min(1, Math.max(0, (dayOfYear - daysToMonthEnd + monthLen) / monthLen));

                const chip = document.createElement('div');
                chip.className = 'year-bar-chip';

                const lbl = document.createElement('div');
                lbl.className = 'year-bar-label';
                lbl.textContent = name;
                chip.appendChild(lbl);

                if (monthPct > 0) {
                    const fill = document.createElement('div');
                    fill.className = 'year-bar-fill';
                    fill.style.width = (monthPct * 100).toFixed(1) + '%';
                    chip.appendChild(fill);
                }

                bar.appendChild(chip);
            });

            requestAnimationFrame(() => bar.classList.add('ready'));
        }

        build();
        setInterval(build, 60000);
    })();

    });
</script>
