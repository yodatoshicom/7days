<script>
// Apply persisted size setting before first paint to prevent flash
(function() {
    var r = document.documentElement;
    r.classList.add('theme-valley');

    var s = localStorage.getItem('aura_note_size');
    if (s === 'S' || s === 'M' || s === 'L') r.style.setProperty('--note-size', 'var(--note-size-' + s + ')');

    // Custom background (image or video) lives in IndexedDB (loaded async after parse).
    // This flag lets us hide the default wallpaper before that load completes,
    // so we don't get a flash of the wrong image on reload.
    if (localStorage.getItem('aura_has_custom_bg') === '1') {
        r.style.backgroundImage = 'none';
        if (localStorage.getItem('aura_custom_bg_kind') === 'video') {
            r.classList.add('has-custom-bg-video');
        }
    }
})();
</script>
<style>

:root {
    --sf-easing: cubic-bezier(0.32, 0.72, 0, 1);
    --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
    --bg-color: #1a1040;
    --text-color: #f0eeff;
    --accent-color: #007AFF;
    --card-bg: rgba(255, 255, 255, 0.08);

    --note-font: 'Caveat', cursive;

    /* ── Note font sizes — single source of truth. Edit these. ── */
    --note-size-S: 21px;
    --note-size-M: 25px;
    --note-size-L: 28px;
    --note-size: var(--note-size-S); /* default */
}

/* ── Valley theme ── */
html.theme-valley {
    background-color: #ededf0;
    background-image: url('img/bg.avif');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
html.theme-valley body {
    background-image: none !important;
    background-color: transparent;
}
/* Custom background video — sits behind everything, covers the viewport like the wallpaper */
#custom-bg-video {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -1;
    pointer-events: none;
}
html.has-custom-bg-video #custom-bg-video { display: block; }
html.has-custom-bg-video { background-image: none !important; }


/* Note color bar — shown below note in editing mode */
.note-color-dot[data-color="default"] { background: rgba(0,0,0,0.08); }
.note-color-dot[data-color="yellow"] { background: #fbbf24; }
.note-color-dot[data-color="blue"] { background: #60a5fa; }
.note-color-dot[data-color="mint"] { background: #34d399; }
.note-color-dot[data-color="pink"] { background: #f472b6; }

.bar-color-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s var(--spring-easing), border-color 0.15s;
    flex-shrink: 0;
}
.bar-color-dot:hover { transform: scale(1.25); }
.bar-color-dot.active { border-color: var(--text-color); }
.bar-color-dot[data-color="default"] { background: rgba(128,128,128,0.25); }
.bar-color-dot[data-color="yellow"] { background: #fbbf24; }
.bar-color-dot[data-color="blue"] { background: #60a5fa; }
.bar-color-dot[data-color="mint"] { background: #34d399; }
.bar-color-dot[data-color="pink"] { background: #f472b6; }




* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

html {
    overflow: hidden;
    height: 100%;
}

body {
    background: none;
    color: var(--text-color);
    height: 100vh;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    position: fixed;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    opacity: 0;
    transition: opacity 0.35s ease;
}

body.ready {
    opacity: 1;
}





.note {
    font-family: Caveat;
    -webkit-text-stroke: .4px currentColor; /* thickens the font; follows text color so it never washes out */
    font-size: 12px;
    letter-spacing: 0.242px;
    position: absolute;
    width: fit-content;
    min-width: 10;
    max-width: 600px;
    min-height: 40px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.005);
    backdrop-filter: blur(1px)!important;
    -webkit-backdrop-filter: blur(2px)!important;
    border: none;
    border-top: 1.2px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        0 2px 6px rgba(0, 0, 0, 0.08);
    color: #000;
    white-space: normal;
    z-index: 1100;
    cursor: grab;
    transition: transform 0.4s var(--spring-easing), box-shadow 0.3s var(--sf-easing), opacity 0.3s ease;
    overflow: visible;
    resize: none;
    user-select: none;
    -webkit-user-select: none;
}
.note.selected {
    outline: 1.5px solid rgba(255, 255, 255, 0.3);
    outline-offset: -2px;
}
/* Per-note delete button — grayscale only (no red): gray translucent disc, white glyph */
.note-delete {
    position: absolute;
    top: -2px;
    right: -6px;
    width: 20px;
    height: 20px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(38, 38, 42, 0.5);
    color: rgba(255, 255, 255, 0.92);
    -webkit-text-fill-color: rgba(255, 255, 255, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.14s ease, transform 0.14s ease, background 0.14s ease;
    z-index: 30;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
.note-delete svg { width: 10px; height: 10px; display: block; }
.note:hover .note-delete,
.note.editing .note-delete { opacity: 1; transform: scale(1); }
.note-delete:hover { background: #1b2a3c; }
.note-delete:active { transform: scale(0.9); }
.note .note-content {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
}
.note textarea { color: inherit; }

.note[data-note-color="yellow"], .note-expand-content[data-note-color="yellow"] { color: #fef08a; }
.note[data-note-color="blue"], .note-expand-content[data-note-color="blue"] { color: #bfdbfe; }
.note[data-note-color="mint"], .note-expand-content[data-note-color="mint"] { color: #a7f3d0; }
.note[data-note-color="pink"], .note-expand-content[data-note-color="pink"] { color: #fbcfe8; }

/* Caveat handwriting reads cleanest in pure white — only on default-color notes */
.note:not([data-note-color]) { color: #ffffff; }


.note:active:not(:has(.note-resize-handle:active)) {
    transform: none;
}

.note.dragging {
    cursor: grabbing;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.15);
    transition: transform 0.4s var(--spring-easing), padding 0.3s var(--sf-easing),
                border-radius 0.3s var(--sf-easing), opacity 0.25s ease;
}


.note-alerts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
    pointer-events: auto;
}
.note-alert-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    line-height: 1;
    font-weight: 800;
    font-size: 1.05em;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #c580fb, #6aa9ff, #34d399, #f5b942, #f472b6, #c580fb);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: alert-shine 6s linear infinite;
    user-select: none;
}
.note-alert-icon,
.note-alert-text {
    display: inline-block;
    line-height: 1;
}
@keyframes alert-shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}
.note-alert-x {
    border: none;
    background: none;
    color: rgba(0,0,0,0.45);
    -webkit-text-fill-color: rgba(0,0,0,0.45);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0 2px;
}
.note-alert-x:hover { color: rgba(0,0,0,0.85); -webkit-text-fill-color: rgba(0,0,0,0.85); }

/* Inline live timers — /10m countdowns rendered in the note's own type */
.note-timer {
    display: inline-flex;
    align-items: baseline;
    gap: 0.16em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    font-family: 'Caveat', cursive;
    font-size: 1.2em;
}
.note-timer-glyph {
    align-self: center;
    display: inline-flex;
    opacity: 0.7;
    transition: opacity 0.12s ease;
}
.note-timer-glyph svg { width: 0.74em; height: 0.74em; display: block; }
.note-timer:hover .note-timer-glyph { opacity: 1; }
.note-timer-time { font-family: 'Caveat', cursive; font-variant-numeric: normal; }
.note-timer.done { opacity: 0.55; }

.note-content {
    font-family: var(--note-font);
    font-weight: var(--note-weight, 400);
    font-size: var(--this-note-font-size, var(--note-size));
    line-height: 1.1;
    outline: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: normal;
    user-select: none;
    -webkit-user-select: none;
}

/* ── Long notes (over NOTE_COLLAPSE_CHARS in JS) collapse to this capped
   height with a soft last-line fade and a "more…" affordance. ── */
.note.is-overflowing .note-content {
    max-height: 100px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
}
.note-more {
    display: none;
    margin-top: 2px;
    width: fit-content;
    font-family: var(--note-font);
    font-size: calc(var(--this-note-font-size, var(--note-size)) * 0.82);
    line-height: 1;
    color: inherit;
    opacity: 0.65;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 0.15s ease;
}
.note-more:hover { opacity: 1; }
.note.is-overflowing > .note-more { display: block; }
.note.editing > .note-more { display: none; }
.note.editing.is-overflowing .note-content { max-height: none; -webkit-mask-image: none; mask-image: none; }

/* ── Manually-resized notes clip text to the chosen box and end with an
   ellipsis on the last visible line (line count computed in JS). ── */
.note.clamped .note-content {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.note.editing.clamped .note-content { display: block; -webkit-line-clamp: none; }

/* Blurred note content state */
.note.blurred .note-content,
.note.blurred .note-image {
    filter: blur(8px);
    opacity: 0.55;
    transition: filter 0.3s ease, opacity 0.3s ease;
    user-select: none;
    pointer-events: none;
}

.note.blurred:hover .note-content,
.note.blurred:hover .note-image {
    filter: blur(2.5px);
    opacity: 0.8;
}

/* Selection rectangle overlay */
.selection-rect {
    position: fixed;
    border: 1px solid rgba(255, 255, 255, 0.45);
    background: rgba(255, 255, 255, 0.08);
    pointer-events: none;
    z-index: 999;
    border-radius: 4px;
    transition: none;
    display: none;
}

/* ── Page Navigation Dots ── */
.page-dots {
    display: none !important;
    position: fixed;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 1200;
    padding: 6px 3px;
}
.page-dot {
    width: 6px;
    height: 14px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
}
.page-dot:hover {
    background: rgba(255, 255, 255, 0.45);
    transform: scale(1.1);
}
.page-dot.active {
    width: 8px;
    height: 20px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.65);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    border: 0.5px solid rgba(255, 255, 255, 0.25);
}
/* Circle variant */
.page-dots.circles .page-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}
.page-dots.circles .page-dot.active {
    width: 10px;
    height: 10px;
    border-radius: 50%;
}
/* Shape toggle button */
.page-shape-toggle {
    display: none !important;
    position: fixed;
    bottom: 12px;
    right: 12px;
    width: 22px;
    height: 22px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 6px;
    cursor: pointer;
    z-index: 1200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.25s ease, opacity 0.25s ease;
    opacity: 0.4;
}
.page-shape-toggle:hover {
    background: rgba(255, 255, 255, 0.25);
    opacity: 0.7;
}
.page-shape-toggle svg {
    width: 12px;
    height: 12px;
    fill: rgba(255, 255, 255, 0.8);
}

/* Disable text selection during multi-select mode */
body.is-selecting {
    user-select: none;
    -webkit-user-select: none;
}

/* Highlight notes that would be selected during rectangle draw */
.note.potential-select {
    outline: 2px solid rgba(255, 255, 255, 0.2);
    outline-offset: -2px;
}

body.note-editing-mode .note.editing {
    user-select: text;
    -webkit-user-select: text;
}

body.note-editing-mode .note.editing .note-content,
body.note-editing-mode .note.editing textarea {
    user-select: text;
    -webkit-user-select: text;
}

.note-edit-ta {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: var(--note-font);
    font-weight: var(--note-weight, 400);
    font-size: var(--this-note-font-size, var(--note-size));
    line-height: 1.1;
    color: inherit;
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    overflow: hidden;
    field-sizing: content;
}
.note-content a {
    color: inherit;
    text-decoration: none;
    border-bottom: 2px solid color-mix(in srgb, currentColor 45%, transparent);
    font-family: inherit !important;
}

/* Image notes */
.note.image-note {
    padding: 6px !important;
    overflow: visible;
    /* backdrop-filter conflicts with video compositor layers causing blank frames
       after tab switches — image/video covers the full note so this is safe to remove */
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
}

.note.image-note .note-content,
.note.image-note .note-color-bar {
    display: none;
}



.note-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 30px;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
}

video.note-image {
    pointer-events: none;
}

.video-play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
}

.note.image-note:hover .video-play-btn {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.video-play-btn:hover {
    background: rgba(0, 0, 0, 0.75);
}

.video-play-btn:active {
    transform: translate(-50%, -50%) scale(0.9);
}

/* ── Video upload progress indicator ── */
.video-upload-indicator {
    position: fixed;
    z-index: 9000;
    width: 180px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 0.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 30px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    animation: vui-in 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes vui-in {
    from { opacity: 0; transform: scale(0.85) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
.video-upload-indicator.done {
    animation: vui-out 0.22s ease forwards;
}
@keyframes vui-out {
    to { opacity: 0; transform: scale(0.88) translateY(4px); }
}
.vui-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 6px;
}
.vui-label svg {
    opacity: 0.6;
    flex-shrink: 0;
}
.vui-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
}
.vui-bar {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.55);
    border-radius: 99px;
    transition: width 0.12s ease;
}




/* ── Note editing mode — page blur ── */
.note-edit-overlay {
    display: none;
}
body.note-editing-mode .note-edit-overlay { display: none; }
body.note-editing-mode .note.editing { z-index: 2000 !important; }

/* ── Expanded note view — blurred page, centered dark "terminal" window ── */
.note-expand-overlay {
    position: fixed;
    inset: 0;
    z-index: 6000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: transparent;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 0.22s ease;
}
.note-expand-overlay.open { display: flex; opacity: 1; }
.note-expand-window {
    position: relative;
    width: 500px;
    max-width: 92vw;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    background: #1b1b1d;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
    transform: scale(0.96);
    transition: transform 0.28s var(--spring-easing);
}
.note-expand-overlay.open .note-expand-window { transform: scale(1); }
.note-expand-close {
    position: absolute;
    top: 14px;
    right: 16px;
    z-index: 1;
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.4);
    font-size: 16px;
    line-height: 1;
    padding: 4px 6px;
    transition: color 0.15s ease;
}
.note-expand-close:hover { color: #fff; }
.note-expand-content {
    flex: 1 1 auto;
    padding: 28px 30px 30px;
    color: #f0eeff;
    font-family: var(--note-font);
    font-size: calc(var(--this-note-font-size, var(--note-size)) * 1.55);
    line-height: 1.4;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
}
.note-expand-content a {
    color: inherit;
    text-decoration: none;
    border-bottom: 2px solid color-mix(in srgb, currentColor 45%, transparent);
}

.note-context-menu {
    position: fixed;
    z-index: 10000;
    /* Frosted glass — milky white veil over a moderate blur (not a heavy smear),
       boosted saturation + brightness so it reads as frost, with a crisp lit edge. */
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.11));
    backdrop-filter: blur(34px) saturate(180%) brightness(1.1);
    -webkit-backdrop-filter: blur(34px) saturate(180%) brightness(1.1);
    border: 0.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 18px;
    padding: 8px;
    box-shadow:
        0 14px 44px rgba(0, 0, 0, 0.30),
        0 3px 10px rgba(0, 0, 0, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 140px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.92);
    transform-origin: top left;
    transition: opacity 0.15s ease, transform 0.25s var(--spring-easing);
}
.note-context-menu.show {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}
.ncm-section {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 4px;
}
.ncm-section.colors {
    justify-content: space-between;
    padding: 4px 8px;
}
.ncm-sep {
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
    margin: 2px 4px;
}
/* Vertical divider — separates inline items within a section row */
.ncm-divider-v {
    width: 1px;
    align-self: stretch;
    margin: 4px 2px;
    background: rgba(255, 255, 255, 0.12);
    flex: 0 0 auto;
}
.ncm-btn {
    flex: 1;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-color);
    font-size: 14px;
    transition: background 0.1s;
    user-select: none;
}
.ncm-btn:hover { background: rgba(255, 255, 255, 0.1); }
.ncm-btn:active { transform: scale(0.95); }

/* Delete button — destructive, refined red pill with trash icon */
.ncm-delete {
    flex: 1;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #ff6b6b;
    background: rgba(255, 255, 255, 0.06);
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    user-select: none;
    -webkit-user-select: none;
}
.ncm-delete svg { width: 14px; height: 14px; opacity: 0.95; }
.ncm-delete:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.3);
    color: #ff8585;
}
.ncm-delete:active { transform: scale(0.97); }

/* Reaction picker row — iMessage-style tapbacks */
.ncm-section.reactions { justify-content: space-between; gap: 2px; }
.ncm-react {
    flex: 1;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    transition: transform 0.15s var(--spring-easing), background 0.1s;
    user-select: none;
}
.ncm-react:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.25); }
.ncm-react:active { transform: scale(1.05); }
.ncm-react.active { background: rgba(120, 170, 255, 0.28); }
/* Inline reaction sitting beside the Blur button — fixed width, not stretched */
.ncm-react-inline { flex: 0 0 auto; width: 36px; height: 32px; }

/* Tapback badge — same frosted glass as the note bubble, top-right corner */
.note-reaction {
    position: absolute;
    top: -12px;
    right: -4px;
    min-width: 28px;
    height: 28px;
    padding: 0 6px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    background: rgba(255, 255, 255, 0.005);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border: none;
    border-top: 1.2px solid rgba(255, 255, 255, 0.15);
    border-radius: 13px;
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08),
        0 2px 6px rgba(0, 0, 0, 0.08);
    z-index: 21;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transform-origin: bottom right;
    animation: reaction-pop 0.3s var(--spring-easing);
}
.note-reaction:hover { filter: brightness(1.15); }
.note-reaction:active { transform: scale(0.88); }
@keyframes reaction-pop {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.18); }
    100% { transform: scale(1); opacity: 1; }
}

.ncm-color-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s var(--spring-easing);
}
.ncm-color-dot:hover { transform: scale(1.2); }
.ncm-color-dot.active { border-color: #fff; }
.ncm-color-dot[data-color="default"] { background: #fff; }
/* White dot needs a dark ring to show selection against itself */
.ncm-color-dot[data-color="default"].active { border-color: rgba(0,0,0,0.55); }
.ncm-color-dot[data-color="yellow"] { background: #fbbf24; }
.ncm-color-dot[data-color="blue"] { background: #60a5fa; }
.ncm-color-dot[data-color="mint"] { background: #34d399; }
.ncm-color-dot[data-color="pink"] { background: #f472b6; }

/* SVG arc resize handle */
.note-resize-handle {
    position: absolute;
    bottom: -5px;
    right: -5px;
    width: 38px;
    height: 38px;
    cursor: nwse-resize;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.9s var(--sf-easing);
    pointer-events: none;
}
.note-resize-handle svg {
    pointer-events: none;
}
.note-resize-handle .rh-fill {
    pointer-events: stroke;
    cursor: nwse-resize;
}

.note:hover .note-resize-handle { opacity: 0.7; pointer-events: none; }
.note:hover .note-resize-handle .rh-fill { pointer-events: stroke; }

.note-resize-handle .rh-fill { }







/* ── Top-right control bar ────────────────────────────────────────────────
   Icons fill right-to-left, macOS menu-bar style. The settings gear is the
   fixed anchor at the right edge (right: 20px, 40px wide). Every toggle is a
   32px round button (.old-dock-toggle-btn) that stacks leftward in 36px steps:

       slot 0 → right: 60px    (first toggle, nearest the gear — the class default)
       slot 1 → right: 96px
       slot 2 → right: 132px
       slot n → right: 60 + n*36 px

   Currently occupied:
      slot 0 → (Empty)

   TO ADD A NEW SWITCH: give the button class="old-dock-toggle-btn" and an id,
   then assign it the next free slot's `right` value (slot 1 → right: 96px),
   so the bar grows leftward and never overlaps the gear.
─────────────────────────────────────────────────────────────────────────── */
.old-dock-toggle-btn {
    position: fixed;
    top: 24px;
    right: 60px;                      /* slot 0 — default for the first toggle */
    z-index: 10001;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    opacity: 0.3;
    transition: opacity 0.3s ease, transform 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    padding: 0;
}
.old-dock-toggle-btn:hover { opacity: 0.8; }
.old-dock-toggle-btn:active { transform: scale(0.9); }
.old-dock-toggle-btn.active { opacity: 0.9; }


/* ── Minidock — current week pill, top center ──
   A white-outlined glass pill (no fill, just a soft tint for legibility).
   Each cell: abbreviated weekday letter above a pronounced day number.
   Today is lifted out in frosted glass. Week runs Mon → Sun. */
.minidock {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10001;
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 5px 8px;
    border-radius: 999px;
    border: 1.5px solid transparent;
    background: transparent;
    opacity: 0;
    transition: opacity 0.45s ease, transform 0.45s var(--spring-easing);
    user-select: none;
    -webkit-user-select: none;
}
.minidock.ready { opacity: 1; }

.minidock-day {
    box-sizing: border-box;
    width: 30px;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 14px;
    padding: 5px 0 6px;
    color: rgba(255, 255, 255, 0.82);
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
}
.minidock-day-wd {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1;
    text-transform: uppercase;
    opacity: 0.55;
}
.minidock-day-num {
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
/* Today — simple translucent fill with a soft blur, brightest text */
.minidock-day.is-today {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.minidock-day.is-today .minidock-day-wd { opacity: 0.88; }
.minidock-day.is-today .minidock-day-num { font-weight: 700; }

/* ── Event dot indicator under date number ── */
.minidock-day-dot {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 3px;
    border-radius: 99px;
    pointer-events: none;
}
.minidock-day-num-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}

/* ── Minidock tooltip ── */
.minidock-tooltip {
    position: fixed;
    z-index: 10002;
    padding: 5px 10px;
    background: rgba(20, 20, 24, 0.90);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.95);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-4px) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
    text-align: center;
    max-width: 180px;
    white-space: normal;
    word-break: break-word;
}
.minidock-tooltip.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
}
.minidock-tooltip-date {
    font-size: 9px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}


/* Current day label — tiny caps, centered right below the dock */
.minidock-day-label {
    position: fixed;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10001;
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
}
.minidock-day-label.ready { opacity: 1; }

/* ── Year progress — same chip style as event chips ── */
.year-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10001;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.45s ease;
    user-select: none;
    -webkit-user-select: none;
}
.year-bar.ready { opacity: 1; }
.year-bar-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 99px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 0.5px solid rgba(255,255,255,0.18);
    position: relative;
    overflow: hidden;
    white-space: nowrap;
}
.year-bar-label {
    position: relative;
    z-index: 1;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.02em;
}
.year-bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    border-radius: 99px;
    background: rgba(255,255,255,0.20);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: width 0.9s var(--sf-easing);
    min-width: 2px;
}


.settings-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10001;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 0.4s ease, transform 0.4s var(--spring-easing);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    padding: 0;
}

.settings-btn:hover { opacity: 1; }
.settings-btn:active { transform: scale(0.92); }
.settings-btn.open { opacity: 1; }


.settings-btn svg {
    transition: transform 0.5s var(--spring-easing);
}
.settings-btn:hover svg { transform: rotate(45deg); }

/* Dev export */
.dev-export-btn {
    position: fixed;
    top: 70px;
    right: 20px;
    z-index: 10001;
    display: none;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    opacity: 0.8;
    letter-spacing: 0.02em;
}
.dev-export-btn:hover { opacity: 1; }
body.dev-mode .dev-export-btn { display: block; }
.dev-only { display: none; }
body.dev-mode .dev-only { display: block; }
.delete-confirm-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    align-items: center;
    justify-content: center;
}
.delete-confirm-modal.open { display: flex; }
.delete-confirm-box {
    background: rgba(28, 28, 30, 0.92);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);

.delete-confirm-msg {

.delete-confirm-sub {

}
.delete-confirm-actions {

}
.delete-confirm-cancel {

}
.delete-confirm-cancel:hover { background: rgba(255,255,255,0.16); }
.delete-confirm-delete {

    border-radius: 8px;

    font-size: 13px;
    font-family: 'DM Sans', sans-serif;

    cursor: pointer;
    transition: background 0.15s;
}
.delete-confirm-delete:hover { background: #ff1f12; }

.dev-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;

.dev-modal.open { display: flex; }
.dev-modal-box {

.settings-panel {
    position: fixed;
    top: 58px;
    right: 20px;
    z-index: 10000;
    background: rgba(22, 22, 24, 0.88);
    backdrop-filter: blur(60px) saturate(180%);
    -webkit-backdrop-filter: blur(60px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 18px;
    padding: 18px;

        0 20px 50px rgba(0,0,0,0.4),

    flex-direction: column;

    pointer-events: none;
    transform: translateY(-12px) scale(0.92);
    transform-origin: top right;
    transition: opacity 0.3s ease, transform 0.5s var(--spring-easing);
    user-select: none;
}

.settings-panel.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

.settings-section-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;

}

.settings-divider {
    height: 0.5px;
    background: rgba(255, 255, 255, 0.12);
    margin: 10px -2px;
}

.settings-discord-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
    color: #b8c0ff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    opacity: 0.85;
}
.settings-discord-link:hover { opacity: 1; text-decoration: none; }
.settings-discord-link svg { flex-shrink: 0; }

.settings-toggle {
    display: flex;
    gap: 2px;
    padding: 2px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
}

.settings-toggle-btn {
    flex: 1;
    padding: 6px 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    opacity: 0.4;
    cursor: pointer;
    transition: opacity 0.2s, background 0.2s, box-shadow 0.2s;
}

<script>
    /* ============================================================
       LANGUAGE SYSTEM: EN / ES / PT (3-way cycle)
    ============================================================ */
    // ---- IndexedDB for media blobs ----
    const mediaDB = (function() {
        const DB_NAME = 'aura_media';
        const STORE = 'blobs';
        let dbPromise = null;
        function open() {
            if (!dbPromise) {
                dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, 1);
                    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => {
                        dbPromise = null;
                        reject(req.error);
                    };
                });
            }
            return dbPromise;
        }
        return {
            async put(key, data) {
                try {
                    const db = await open();
                    return new Promise((resolve) => {
                        const tx = db.transaction(STORE, 'readwrite');
                        tx.objectStore(STORE).put(data, key);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => {
                            console.error('mediaDB put failed:', tx.error);
                            resolve(false);
                        };
                    });
                } catch (e) {
                    console.error('mediaDB put failed:', e);
                    return false;
                }
            },
            async get(key) {
                try {
                    const db = await open();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE, 'readonly');
                        const req = tx.objectStore(STORE).get(key);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.error('mediaDB get failed:', e);
                    return null;
                }
            },
            async del(key) {
                try {
                    const db = await open();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE, 'readwrite');
                        tx.objectStore(STORE).delete(key);
                        tx.oncomplete = () => resolve();
                        tx.onerror = () => reject(tx.error);
                    });
                } catch (e) {
                    console.error('mediaDB del failed:', e);
                }
            },
            async keys() {
                try {
                    const db = await open();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(STORE, 'readonly');
                        const req = tx.objectStore(STORE).getAllKeys();
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    console.error('mediaDB keys failed:', e);
                    return [];
                }
            }
        };
    })();

    const LANGS = ['en', 'es', 'pt'];
    const LANG_LABELS = { en: 'EN', es: 'ES', pt: 'PT' };
    const PAGE_COUNT = 4;

    // ---- Everything is saved in IndexedDB (notes, media, settings). ----
    // localStorage is only a tiny cache mirror used by the pre-paint script
    // (note size + custom-bg flag) so the first frame has no flash.
    function cacheWrite(name, value) {
        try { localStorage.setItem('aura_' + name, String(value)); } catch (_) {}
    }
    function cacheRemove(name) {
        try { localStorage.removeItem('aura_' + name); } catch (_) {}
    }
    async function getSetting(name) {
        return await mediaDB.get('settings_' + name);
    }
    async function setSetting(name, value) {
        const ok = await mediaDB.put('settings_' + name, value);
        if (ok) cacheWrite(name, value);
        return ok;
    }

    let lang = 'en';
    let notes = [];
    let currentPage = 0;
    let topZ = 1100;
    let noteSize = 'S';

    // Async boot: hydrate notes + settings from IndexedDB before first render.
    const appReady = (async () => {
        let stored = await mediaDB.get('notes');
        if (!Array.isArray(stored) || !stored.length) {
            // One-time migration from legacy localStorage storage
            let legacy = null;
            try { legacy = JSON.parse(localStorage.getItem('aura_notes_v3') || 'null'); } catch (_) {}
            if (Array.isArray(legacy) && legacy.length) stored = legacy;
        }
        notes = stored || [];

        // Migration: ensure all notes have createdAt + page properties
        notes.forEach(n => { if (!n.createdAt) n.createdAt = Date.now(); });
        notes.forEach(n => { if (n.page == null) n.page = 0; });

        // First time — seed a few simple hint notes
        if (notes.length === 0) {
            notes = [
                { "id": "n1776098065375", "x": 110, "y": 92,  "w": 220, "text": "welcome to weekdash", "page": 0, "zIndex": 100, "createdAt": Date.now() },
                { "id": "n1776098095232", "x": 330, "y": 150, "w": 240, "text": "double-click anywhere to create a note", "page": 0, "zIndex": 101, "createdAt": Date.now() },
                { "id": "n1776098589852", "x": 140, "y": 235, "w": 200, "text": "drag a note to move it", "page": 0, "zIndex": 102, "createdAt": Date.now() },
                { "id": "n1776100345016", "x": 360, "y": 300, "w": 162, "text": "weekdash.com", "page": 0, "zIndex": 103, "createdAt": Date.now() }
            ];
            await mediaDB.put('notes', notes);
        } else {
            // Legacy localStorage copy no longer needed once IDB has the data
            try { localStorage.removeItem('aura_notes_v3'); } catch (_) {}
        }

        // Settings — prefer IndexedDB, fall back to the old localStorage cache
        const storedLang = await getSetting('lang');
        lang = LANGS.includes(storedLang) ? storedLang
             : (LANGS.includes(localStorage.getItem('aura_lang')) ? localStorage.getItem('aura_lang') : 'en');
        let cp = await getSetting('current_page');
        if (cp == null) cp = localStorage.getItem('aura_current_page');
        cp = parseInt(cp, 10);
        currentPage = (isNaN(cp) || cp < 0 || cp >= PAGE_COUNT) ? 0 : cp;
        let sz = await getSetting('note_size');
        if (sz !== 'S' && sz !== 'M' && sz !== 'L') sz = localStorage.getItem('aura_note_size');
        noteSize = (sz === 'S' || sz === 'M' || sz === 'L') ? sz : 'S';

        // One-time font reset migration (was localStorage aura_font_reset_v2)
        if (!(await getSetting('font_reset_v2'))) {
            noteSize = 'S';
            await setSetting('note_size', noteSize);
            await setSetting('font_reset_v2', '1');
        }

        topZ = Math.max(1100, ...notes.map(n => n.zIndex || 0));
        renderPageDots();
    })();

    function switchPage(page) {
        if (page === currentPage) return;
        clearSelection();
        currentPage = page;
        setSetting('current_page', String(page));
        // Hide/show notes based on page
        document.querySelectorAll('.note').forEach(el => {
            const d = notes.find(n => n.id === el.id);
            const show = (d && d.page === currentPage);
            const wasHidden = el.style.display === 'none';
            el.style.display = show ? '' : 'none';
            if (show && wasHidden) {
                const vid = el.querySelector('video');
                if (vid && vid.src) vid.load();
            }
        });
        renderPageDots();
    }

    function renderPageDots() {
        let container = document.getElementById('page-dots');
        if (!container) {
            container = document.createElement('div');
            container.className = 'page-dots';
            container.id = 'page-dots';
            document.body.appendChild(container);
        }
        container.className = 'page-dots';
        container.innerHTML = '';
        for (let i = 0; i < PAGE_COUNT; i++) {
            const dot = document.createElement('div');
            dot.className = 'page-dot' + (i === currentPage ? ' active' : '');
            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                switchPage(i);
            });
            container.appendChild(dot);
        }
    }
    renderPageDots(); // pre-render so the page-dots container exists early

    // Shape toggle button removed

    let selectedNoteIds = new Set();
    const selRect = document.getElementById('selection-rect');
    let isSelecting = false;
    let selStart = { x: 0, y: 0 };

    // Track mouse for paste-to-note
    let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    document.addEventListener('mousemove', (e) => {
        mousePos.x = e.clientX;
        mousePos.y = e.clientY;
    });

    document.addEventListener('paste', (e) => {
        // Skip if typing in an input/textarea
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.contentEditable === 'true') return;

        const text = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (!text) return;

        // Simple URL check
        const urlRegex = /^(https?:\/\/)?([\da-z.-]+)\.([a-z.]{2,6})([/\w .-]*)*\/?$/i;
        if (urlRegex.test(text)) {
            e.preventDefault();
            // Extract domain.tld
            let domain = text.replace(/^(https?:\/\/)?(www\.)?/i, '').split('/')[0];
            
            const newNote = {
                id: 'n' + Date.now(),
                x: mousePos.x - 100,
                y: mousePos.y - 20,
                text: text,
                displayTitle: domain,
                zIndex: ++topZ,
                page: currentPage,
                createdAt: Date.now()
            };
            // Actually, user wants trimmed text in the note.
            newNote.text = domain; 

            notes.push(newNote);
            createNote(newNote, true);
            save();
        }
    });

    // ---- MULTI-SELECTION HELPERS ----
    function clearSelection() {
        selectedNoteIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.remove('selected');
        });
        selectedNoteIds.clear();
    }

    function toggleNoteSelection(id) {
        const el = document.getElementById(id);
        if (!el) return;
        if (selectedNoteIds.has(id)) {
            selectedNoteIds.delete(id);
            el.classList.remove('selected');
        } else {
            selectedNoteIds.add(id);
            el.classList.add('selected');
        }
    }

    function selectNotesInRect(x1, y1, x2, y2) {
        const left = Math.min(x1, x2);
        const top = Math.min(y1, y2);
        const right = Math.max(x1, x2);
        const bottom = Math.max(y1, y2);

        clearSelection();

        document.querySelectorAll('.note').forEach(el => {
            const rect = el.getBoundingClientRect();
            // Collision: rectangle intersection
            if (rect.left < right && rect.right > left && rect.top < bottom && rect.bottom > top) {
                selectedNoteIds.add(el.id);
                el.classList.add('selected');
            }
        });
    }

    // ---- COPY / PASTE SELECTED NOTES ----
    let copiedNotes = null;

    let arrowSaveTimer = null;
    function scheduleArrowSave() {
        if (arrowSaveTimer) clearTimeout(arrowSaveTimer);
        arrowSaveTimer = setTimeout(() => { arrowSaveTimer = null; save(); }, 200);
    }

    // ---- UNDO FOR DELETED NOTES ----
    // Stack of deletion batches; each batch is a deep copy of the removed notes
    // so later media eviction / mutation can't corrupt the snapshot.
    const deletedNotesStack = [];
    const MAX_UNDO = 25;

    function pushDeletedUndo(dataArr) {
        if (!dataArr || !dataArr.length) return;
        deletedNotesStack.push(dataArr.map(d => JSON.parse(JSON.stringify(d))));
        if (deletedNotesStack.length > MAX_UNDO) deletedNotesStack.shift();
    }

    function restoreLastDeleted() {
        const batch = deletedNotesStack.pop();
        if (!batch) return;
        clearSelection();
        batch.forEach(d => {
            delete d._deleted;
            d.zIndex = ++topZ;
            notes.push(d);
            createNote(d);
            const el = document.getElementById(d.id);
            if ((d.page || 0) === currentPage) {
                selectedNoteIds.add(d.id);
                if (el) el.classList.add('selected');
            } else if (el) {
                el.style.display = 'none';
            }
            if (d.alerts && d.alerts.length) d.alerts.forEach(a => scheduleAlert(d, a));
        });
        save();
    }

    window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.contentEditable === 'true') return;

        // Cmd/Ctrl+Z — undo the last note deletion. Guarded by the text-field
        // check above, so native undo still works while editing a note's text.
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && deletedNotesStack.length) {
            e.preventDefault();
            restoreLastDeleted();
            return;
        }

        // Cmd/Ctrl+C — copy selected notes
        if ((e.metaKey || e.ctrlKey) && e.key === 'c' && selectedNoteIds.size > 0) {
            e.preventDefault();
            const selectedData = notes.filter(n => selectedNoteIds.has(n.id));
            if (!selectedData.length) return;
            // Store copies with relative positions (offset from the group's top-left)
            const minX = Math.min(...selectedData.map(n => n.x));
            const minY = Math.min(...selectedData.map(n => n.y));
            copiedNotes = selectedData.map(n => ({
                text: n.text,
                color: n.color,
                imageData: n.imageData,
                w: n.w,
                h: n.h,
                manualResize: n.manualResize,
                ox: n.x - minX,
                oy: n.y - minY,
            }));
            return;
        }

        // Cmd/Ctrl+V — paste copied notes at mouse position
        if ((e.metaKey || e.ctrlKey) && e.key === 'v' && copiedNotes) {
            e.preventDefault();
            clearSelection();
            const baseX = mousePos.x - 20;
            const baseY = mousePos.y - 20;
            copiedNotes.forEach(src => {
                const n = {
                    id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6),
                    x: baseX + src.ox,
                    y: baseY + src.oy,
                    text: src.text,
                    color: src.color,
                    w: src.w,
                    h: src.h,
                    manualResize: src.manualResize,
                    imageData: src.imageData,
                    zIndex: ++topZ,
                    page: currentPage,
                    createdAt: Date.now()
                };
                notes.push(n);
                createNote(n);
                selectedNoteIds.add(n.id);
                const el = document.getElementById(n.id);
                if (el) el.classList.add('selected');
            });
            save();
            return;
        }

        // Delete / Backspace — delete selected notes immediately
        if ((e.key === 'Delete' || e.key === 'Backspace') && selectedNoteIds.size > 0) {
            e.preventDefault();
            commitDeleteSelected();
            return;
        }

        // Arrow keys — nudge selected notes (Shift = bigger step)
        if (selectedNoteIds.size > 0 &&
            (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
            e.preventDefault();
            const step = e.shiftKey ? 10 : 1;
            const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
            const dy = e.key === 'ArrowUp'   ? -step : e.key === 'ArrowDown'  ? step : 0;
            const margin = 20;
            selectedNoteIds.forEach(id => {
                const data = notes.find(n => n.id === id);
                const el = document.getElementById(id);
                if (!data || !el) return;
                const w = el.offsetWidth, h = el.offsetHeight;
                const nx = Math.min(Math.max(data.x + dx, margin), window.innerWidth  - w - margin);
                const ny = Math.min(Math.max(data.y + dy, margin), window.innerHeight - h - margin);
                data.x = nx; data.y = ny;
                el.style.left = nx + 'px';
                el.style.top  = ny + 'px';
            });
            scheduleArrowSave();
            return;
        }
    });

    // ---- DELETE CONFIRM MODAL ----
    const deleteConfirmModal  = document.getElementById('delete-confirm-modal');
    const deleteConfirmMsg    = document.getElementById('delete-confirm-msg');
    const deleteConfirmCancel = document.getElementById('delete-confirm-cancel');
    const deleteConfirmBtn    = document.getElementById('delete-confirm-delete');

    function showDeleteConfirm() {
        const count = selectedNoteIds.size;
        deleteConfirmMsg.textContent = `Delete ${count} ${count === 1 ? 'note' : 'notes'}?`;
        deleteConfirmModal.classList.add('open');
        deleteConfirmBtn.focus();
    }

    function hideDeleteConfirm() {
        deleteConfirmModal.classList.remove('open');
    }

    function commitDeleteSelected() {
        pushDeletedUndo(notes.filter(n => selectedNoteIds.has(n.id)));
        selectedNoteIds.forEach(id => {
            const data = notes.find(n => n.id === id);
            if (data) cancelAlertsFor(data);
            if (data && data.imageData) mediaDB.del('media_' + id);
            const el = document.getElementById(id);
            if (el) el.remove();
        });
        notes = notes.filter(n => !selectedNoteIds.has(n.id));
        selectedNoteIds.clear();
        save();
        hideDeleteConfirm();
    }

    deleteConfirmCancel.addEventListener('click', hideDeleteConfirm);
    deleteConfirmBtn.addEventListener('click', commitDeleteSelected);

    deleteConfirmModal.addEventListener('mousedown', (e) => {
        if (e.target === deleteConfirmModal) hideDeleteConfirm();
    });

    window.addEventListener('keydown', (e) => {
        if (deleteConfirmModal.classList.contains('open')) {
            if (e.key === 'Escape') { e.preventDefault(); hideDeleteConfirm(); }
            if (e.key === 'Enter')  { e.preventDefault(); commitDeleteSelected(); }
        }
    });

    // ---- SELECTION RECTANGLE ON WINDOW CLICK ----
    window.addEventListener('mousedown', (e) => {
        // Only start selection if clicking on empty space (not on a note, not on UI elements)
        if (
            e.button !== 0 ||
            e.target.closest('.note') ||
            e.target.closest('.settings-btn') ||
            e.target.closest('.search-overlay') ||
            e.target.closest('.note-context-menu') ||
            e.target.closest('.dev-modal') ||
            e.target.closest('.delete-confirm-modal') ||
            ['INPUT', 'TEXTAREA', 'BUTTON', 'A'].includes(e.target.tagName)
        ) return;

        isSelecting = true;
        selStart.x = e.clientX;
        selStart.y = e.clientY;
        
        document.body.classList.add('is-selecting');
        selRect.style.display = 'block';
        selRect.style.left = e.clientX + 'px';
        selRect.style.top = e.clientY + 'px';
        selRect.style.width = '0px';
        selRect.style.height = '0px';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isSelecting) return;
        
        const x = e.clientX;
        const y = e.clientY;
        const left = Math.min(selStart.x, x);
        const top = Math.min(selStart.y, y);
        const width = Math.abs(x - selStart.x);
        const height = Math.abs(y - selStart.y);
        
        selRect.style.left = left + 'px';
        selRect.style.top = top + 'px';
        selRect.style.width = width + 'px';
        selRect.style.height = height + 'px';
        
        // Live preview: highlight notes that would be selected
        const right = Math.max(selStart.x, x);
        const bottom = Math.max(selStart.y, y);
        
        document.querySelectorAll('.note').forEach(el => {
            const rect = el.getBoundingClientRect();
            // Collision: rectangle intersection
            if (rect.left < right && rect.right > left && rect.top < bottom && rect.bottom > top) {
                el.classList.add('potential-select');
            } else {
                el.classList.remove('potential-select');
            }
        });
    });

    window.addEventListener('mouseup', (e) => {
        if (!isSelecting) return;
        isSelecting = false;
        document.body.classList.remove('is-selecting');
        
        const x = e.clientX;
        const y = e.clientY;
        const width = Math.abs(x - selStart.x);
        const height = Math.abs(y - selStart.y);
        
        // Remove potential-select from all notes
        document.querySelectorAll('.note.potential-select').forEach(el => el.classList.remove('potential-select'));
        
        // Only select if rectangle is large enough (avoid accidental clicks)
        if (width > 10 && height > 10) {
            selectNotesInRect(selStart.x, selStart.y, x, y);
        } else {
            // Small click - clear selection
            clearSelection();
        }
        
        selRect.style.display = 'none';
    });


    /* ============================================================
       LINKIFY
    ============================================================ */
    function wrapNote(note, data) {
        if (data.imageData) return;
        const content = note.querySelector('.note-content');
        if (!content) return;
        const text = data.text || '';
        if (!text.trim()) return;

        // Always clear fixed height so it auto-sizes to content
        note.style.height = '';
        delete data.h;

        if (data.manualResize) return;

        const lines = text.split('\n');

        // Single line (no explicit newlines) — let CSS fit-content + max-width handle it
        if (lines.length <= 1) {
            note.style.width = '';
            delete data.w;
            updateNoteOverflow(note, data);
            return;
        }

        // Multi-line: measure the longest line and size to fit
        const cs = getComputedStyle(content);
        const mirror = document.createElement('div');
        mirror.style.cssText = 'position:fixed;top:-9999px;left:-9999px;white-space:pre;visibility:hidden;pointer-events:none;';
        mirror.style.fontFamily = cs.fontFamily;
        mirror.style.fontSize = cs.fontSize;
        mirror.style.fontWeight = cs.fontWeight;
        mirror.style.lineHeight = cs.lineHeight;
        mirror.style.letterSpacing = cs.letterSpacing;
        document.body.appendChild(mirror);

        const NOTE_PAD = 32;
        const NOTE_MAX = 568;
        const NOTE_MIN = 80;

        let maxW = 0;
        lines.forEach(line => {
            mirror.textContent = line || ' ';
            maxW = Math.max(maxW, mirror.getBoundingClientRect().width);
        });
        mirror.remove();

        const edgeMax = Math.max(NOTE_MIN, window.innerWidth - data.x - 16);
        const w = Math.max(Math.min(Math.ceil(maxW) + NOTE_PAD, NOTE_MAX + NOTE_PAD, edgeMax), NOTE_MIN);
        note.style.width = w + 'px';
        data.w = w;
        updateNoteOverflow(note, data);
    }

    function linkify(text) {
        const urlRegex = /((https?:\/\/|www\.)[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}[^\s]*)/gi;
        return text.replace(urlRegex, (url) => {
            let href = url.startsWith('http') ? url : 'https://' + url;
            return `<a href="${href}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${url}</a>`;
        });
    }


    function renderNoteContent(content, text, data) {
        const timers = (data && data.timers) || [];
        content.innerHTML = '';
        const appendText = (seg) => {
            if (!seg) return;
            const tmp = document.createElement('span');
            tmp.innerHTML = linkify(seg);
            while (tmp.firstChild) content.appendChild(tmp.firstChild);
        };
        const re = timerTokenRe();
        let m, last = 0, ti = 0;
        while ((m = re.exec(text))) {
            appendText(text.slice(last, m.index));
            const t = timers[ti++];
            if (t) content.appendChild(makeTimerEl(t));
            else   appendText(m[0]);
            last = m.index + m[0].length;
        }
        appendText(text.slice(last));
    }

    // Notes longer than this collapse on the canvas and open in a centered overlay.
    const NOTE_COLLAPSE_CHARS = 300;

    function updateNoteOverflow(note, data) {
        const content = note.querySelector('.note-content');
        const existing = note.querySelector('.note-more');
        // Image notes and user-resized notes keep their own size; never collapse them.
        if (!content || data.imageData || data.manualResize || note.classList.contains('editing')) {
            note.classList.remove('is-overflowing');
            if (existing) existing.remove();
            return;
        }
        note.classList.remove('is-overflowing');
        if ((data.text || '').length > NOTE_COLLAPSE_CHARS) {
            note.classList.add('is-overflowing');
            if (!existing) {
                const more = document.createElement('div');
                more.className = 'note-more';
                more.textContent = 'more…';
                more.addEventListener('mousedown', (e) => e.stopPropagation());
                more.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openNoteExpanded(data);
                });
                note.appendChild(more);
            }
        } else if (existing) {
            existing.remove();
        }
    }

    // For manually-resized notes: clip the text to the chosen box height and
    // add an ellipsis on the last visible line. Auto-sized notes never clamp.
    function applyResizeClamp(note, data) {
        const content = note.querySelector('.note-content');
        if (!content || !data.manualResize || data.imageData || note.classList.contains('editing')) {
            note.classList.remove('clamped');
            content && (content.style.webkitLineClamp = '');
            return;
        }
        const lineH = parseFloat(getComputedStyle(content).lineHeight) || 1;
        const bottomPad = parseFloat(getComputedStyle(note).paddingBottom) || 0;
        const avail = note.clientHeight - content.offsetTop - bottomPad;
        const lines = Math.max(1, Math.floor((avail + 0.5) / lineH));
        content.style.webkitLineClamp = String(lines);
        note.classList.add('clamped');
    }

    const noteExpandOverlay = document.getElementById('note-expand-overlay');
    const noteExpandContent = document.getElementById('note-expand-content');

    function openNoteExpanded(data) {
        if (data.color && data.color !== 'default') noteExpandContent.setAttribute('data-note-color', data.color);
        else noteExpandContent.removeAttribute('data-note-color');

        if (data.fontSize) noteExpandContent.style.setProperty('--this-note-font-size', data.fontSize + 'px');
        else noteExpandContent.style.removeProperty('--this-note-font-size');

        renderNoteContent(noteExpandContent, data.text || '', data);
        noteExpandContent.scrollTop = 0;
        noteExpandOverlay.classList.add('open');
    }
    function closeNoteExpanded() {
        noteExpandOverlay.classList.remove('open');
        // The overlay's fullscreen backdrop-filter leaves collapsed notes in a
        // stale composited state (clip/mask dropped) on Chromium/WebKit. A class
        // re-toggle gets coalesced and never repaints; a display toggle forces a
        // real reflow + fresh paint, which restores the clip.
        document.querySelectorAll('.note.is-overflowing').forEach(el => {
            el.style.display = 'none';
            void el.offsetHeight;
            el.style.display = '';
        });
    }
    noteExpandOverlay.addEventListener('click', (e) => {
        if (e.target === noteExpandOverlay) closeNoteExpanded();
    });
    document.getElementById('note-expand-close').addEventListener('click', closeNoteExpanded);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && noteExpandOverlay.classList.contains('open')) closeNoteExpanded();
    });




    function applyLang(newLang) {
        lang = newLang;
        setSetting('lang', lang);
        document.documentElement.lang = lang;

        // Update picker buttons
        document.querySelectorAll('#lang-picker .settings-toggle-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === lang);
        });

        if (window.updateMinidockLang) window.updateMinidockLang();
    }

    document.getElementById('lang-picker').addEventListener('click', (e) => {
        const btn = e.target.closest('.settings-toggle-btn');
        if (!btn) return;
        applyLang(btn.dataset.lang);
    });

    /* ============================================================
       NOTES — drag + RESIZE (macOS bottom-right handle)
    ============================================================ */
    const contextMenu = document.getElementById('note-context-menu');
    function openContextMenu(x, y, noteEl, data) {
        activeNoteRef = { note: noteEl, data };
        contextMenu.classList.add('show');
        const menuW = contextMenu.offsetWidth;
        const menuH = contextMenu.offsetHeight;
        let left = x, top = y;
        if (left + menuW > window.innerWidth - 10) left = window.innerWidth - menuW - 10;
        if (top + menuH > window.innerHeight - 10) top = window.innerHeight - menuH - 10;
        contextMenu.style.left = left + 'px';
        contextMenu.style.top = top + 'px';
        
        const activeColor = data.color || 'default';
        contextMenu.querySelectorAll('.ncm-color-dot').forEach(d =>
            d.classList.toggle('active', d.dataset.color === activeColor)
        );
        const activeReaction = data.reaction || null;
        contextMenu.querySelectorAll('.ncm-react').forEach(r =>
            r.classList.toggle('active', r.dataset.react === activeReaction)
        );
    }
    function closeContextMenu() {
        contextMenu.classList.remove('show');
    }
    contextMenu.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        const dot = e.target.closest('.ncm-color-dot');
        const react = e.target.closest('.ncm-react');
        const btn = e.target.closest('.ncm-btn, .ncm-delete');
        if (react && activeNoteRef.note) {
            const { note, data } = activeNoteRef;
            const emoji = react.dataset.react;
            data.reaction = (data.reaction === emoji) ? null : emoji; // tap again to clear
            renderNoteReaction(note, data);
            contextMenu.querySelectorAll('.ncm-react').forEach(r =>
                r.classList.toggle('active', r.dataset.react === data.reaction)
            );
            save();
            closeContextMenu();
            return;
        }
        if (dot && activeNoteRef.note) {
            const c = dot.dataset.color;
            const { note, data } = activeNoteRef;
            data.color = c;
            if (c && c !== 'default') note.setAttribute('data-note-color', c);
            else note.removeAttribute('data-note-color');
            contextMenu.querySelectorAll('.ncm-color-dot').forEach(d =>
                d.classList.toggle('active', d.dataset.color === c)
            );
            save();
        } else if (btn) {
            // Handle font size actions
            if ((btn.dataset.action === 'font-plus' || btn.dataset.action === 'font-minus') && activeNoteRef.note) {
                const { note, data } = activeNoteRef;
                let current = data.fontSize;
                if (!current) {
                    const s = noteSize || 'S';
                    current = (s === 'M') ? 25 : (s === 'L' ? 28 : 21);
                }
                if (btn.dataset.action === 'font-plus') current += 2;
                else current = Math.max(10, current - 2);
                data.fontSize = current;
                note.style.setProperty('--this-note-font-size', current + 'px');
                applyResizeClamp(note, data);
                save();
                return; // keep menu open for rapid clicks
            }
            // Handle delete action
            if (btn.dataset.action === 'delete' && activeNoteRef.note) {
                const { note, data } = activeNoteRef;
                closeContextMenu();
                deleteNote(note, data);
                return;
            }
            // Handle blur action
            if (btn.dataset.action === 'blur' && activeNoteRef.note) {
                const { note, data } = activeNoteRef;
                data.blurred = !data.blurred;
                note.classList.toggle('blurred', data.blurred);
                save();
                closeContextMenu();
                return;
            }
            closeContextMenu();
        }
    });
    contextMenu.addEventListener('dblclick', (e) => {
        e.preventDefault(); e.stopPropagation();
    });
    window.addEventListener('mousedown', (e) => {
        if (!e.target.closest('#note-context-menu')) closeContextMenu();
    });

    // Remove a note entirely (shared by the close button and the menu's Delete row)
    function deleteNote(note, data) {
        pushDeletedUndo([data]);
        cancelAlertsFor(data);
        if (data.imageData) mediaDB.del('media_' + data.id);
        data._deleted = true;
        note.remove();
        notes = notes.filter(n => n.id !== data.id);
        document.body.classList.remove('note-editing-mode');
        activeNoteRef = { note: null, data: null };
        document.querySelectorAll('.note').forEach(n => n.style.opacity = '');
        save();
    }

    // Render (or clear) the iMessage-style tapback badge on a note's top-right corner
    function renderNoteReaction(note, data) {
        const existing = note.querySelector('.note-reaction');
        if (existing) existing.remove();
        if (!data.reaction) return;
        const badge = document.createElement('div');
        badge.className = 'note-reaction';
        badge.textContent = data.reaction;
        badge.title = 'Remove reaction';
        badge.addEventListener('mousedown', (e) => e.stopPropagation());
        badge.addEventListener('click', (e) => {
            e.stopPropagation();
            data.reaction = null;
            renderNoteReaction(note, data);
            save();
        });
        note.appendChild(badge);
    }

function createNote(data, autoFocus = false) {
        const note = document.createElement('div');
        note.className = 'note';
        note.id = data.id;
        note.style.left = Math.max(data.x, 20) + 'px';
        note.style.top  = Math.max(data.y, 20) + 'px';
        requestAnimationFrame(() => {
            const margin = 20;
            const nx = parseFloat(note.style.left);
            const ny = parseFloat(note.style.top);
            note.style.left = Math.min(nx, window.innerWidth  - note.offsetWidth  - margin) + 'px';
            note.style.top  = Math.min(ny, window.innerHeight - note.offsetHeight - margin) + 'px';
        });
        if (data.w) note.style.width = data.w + 'px';
        if (data.manualResize && data.h) note.style.height = data.h + 'px';
        note.style.zIndex = data.zIndex || topZ;
        if (data.color && data.color !== 'default') note.setAttribute('data-note-color', data.color);
        if (data.blurred) note.classList.add('blurred');
        if (data.fontSize) note.style.setProperty('--this-note-font-size', data.fontSize + 'px');

        const content = document.createElement('div');
        content.className = 'note-content';
        content.spellcheck = false;
        note.appendChild(content);
        reconcileTimers(data);
        renderNoteContent(content, data.text || '', data);
        if (data.reaction) renderNoteReaction(note, data);
        if (data.alerts && data.alerts.length) {
            requestAnimationFrame(() => renderAlertChips(note, data));
        }

// ---- IMAGE NOTE ----
        if (data.imageData) {
            note.classList.add('image-note');
            const srcStr = typeof data.imageData === 'string' ? data.imageData : '';
            const isVideoSrc = srcStr.startsWith('data:video/') || /\.(mov|mp4|webm|ogv|ogg|av1)(\?.*)?$/i.test(srcStr);
            if (isVideoSrc) {
                const vid = document.createElement('video');
                vid.className = 'note-image';
                vid.src = srcStr;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                vid.autoplay = false;
                vid.draggable = false;
                vid.ondragstart = () => false;
                note.insertBefore(vid, content);

                const playBtn = document.createElement('button');
                playBtn.className = 'video-play-btn';
                const pauseIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
                const playIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
                playBtn.innerHTML = playIcon;
                playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (vid.paused) {
                        vid.play();
                        playBtn.innerHTML = pauseIcon;
                    } else {
                        vid.pause();
                        playBtn.innerHTML = playIcon;
                    }
                });
                note.insertBefore(playBtn, content);
            } else {
                const img = document.createElement('img');
                img.className = 'note-image';
                img.src = srcStr;
                img.draggable = false;
                img.ondragstart = () => false;
                note.insertBefore(img, content);
            }
        }


        // ---- DELETE BUTTON (top-right, grayscale) ----
        const delBtn = document.createElement('button');
        delBtn.className = 'note-delete';
        delBtn.type = 'button';
        delBtn.title = 'Delete note';
        delBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`;
        delBtn.addEventListener('mousedown', (e) => e.stopPropagation());
        delBtn.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); deleteNote(note, data); });
        note.appendChild(delBtn);

        // ---- RESIZE HANDLE (bottom-right, iOS style) ----
        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'note-resize-handle';
        // SVG arc — quarter circle matching note's 30px border-radius, convex toward corner
        // Arc: center at (4,4), radius 30, from (34,4) to (4,34), sweep clockwise
        resizeHandle.innerHTML = `<svg width="36" height="36" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 33.0,11.8 A 30,30 0 0,1 11.8,33.0" stroke="transparent" stroke-width="20" stroke-linecap="round" style="pointer-events:stroke;cursor:nwse-resize"/>
          <path class="rh-fill" d="M 33.0,15 A 30,30 0 0,1 15,33.0" stroke="rgba(255,255,255,1)" stroke-width="6" stroke-linecap="round" style="pointer-events:none"/>
        </svg>`;
        note.appendChild(resizeHandle);

        document.body.appendChild(note);
        requestAnimationFrame(() => { updateNoteOverflow(note, data); applyResizeClamp(note, data); });

        // ---- CLAMP NOTE TO VIEWPORT ----
        const clampNote = (x, y) => {
            const margin = 20;
            const w = note.offsetWidth;
            const h = note.offsetHeight;
            return {
                x: Math.min(Math.max(x, margin), window.innerWidth  - w - margin),
                y: Math.min(Math.max(y, margin), window.innerHeight - h - margin)
            };
        };

        // ---- DRAG (mouse + touch) ----
        const startDrag = (clientX, clientY) => {
            const origOx = clientX - note.offsetLeft;
            const origOy = clientY - note.offsetTop;
            const dragOrigins = [{ data, x: note.offsetLeft, y: note.offsetTop, z: note.style.zIndex }];
            note.style.zIndex = ++topZ;
            note.classList.add('dragging');

            // Track offsets for all selected notes
            const selectedOffsets = [];
            if (selectedNoteIds.size > 1) {
                selectedNoteIds.forEach(id => {
                    if (id === data.id) return;
                    const el = document.getElementById(id);
                    if (el) {
                        selectedOffsets.push({
                            el,
                            ox: clientX - el.offsetLeft,
                            oy: clientY - el.offsetTop
                        });
                        const d = notes.find(n => n.id === id);
                        if (d) dragOrigins.push({ data: d, x: el.offsetLeft, y: el.offsetTop, z: el.style.zIndex });
                    }
                });
            }

            // Opt/Alt during the drag duplicates (Finder/Figma-style): clones of
            // the dragged notes stay behind at their origin while the originals
            // follow the cursor; releasing Opt before drop removes the clones.
            let altClones = null;
            const setAltDup = (on) => {
                if (on === !!altClones) return;

                // Apply transparency to the notes being dragged to signal duplication
                note.style.opacity = on ? '0.6' : '';
                selectedOffsets.forEach(({ el }) => {
                    el.style.opacity = on ? '0.6' : '';
                });

                if (on) {
                    altClones = dragOrigins.map(o => {
                        const dup = JSON.parse(JSON.stringify(o.data));
                        dup.id = 'n' + Date.now() + Math.random().toString(36).slice(2, 6);
                        // Alert/timer ids are tracked globally — strip them so the
                        // copy gets fresh ones instead of hijacking the original's.
                        delete dup.alerts;
                        delete dup.timers;
                        dup.x = o.x;
                        dup.y = o.y;
                        dup.zIndex = o.z;
                        dup.page = currentPage;
                        dup.createdAt = Date.now();
                        notes.push(dup);
                        createNote(dup);
                        return dup;
                    });
                } else {
                    altClones.forEach(dup => {
                        (dup.timers || []).forEach(t => cancelAlertById(t.id));
                        if (dup.imageData) mediaDB.del('media_' + dup.id);
                        const el = document.getElementById(dup.id);
                        if (el) el.remove();
                        const i = notes.indexOf(dup);
                        if (i !== -1) notes.splice(i, 1);
                    });
                    altClones = null;
                }
            };

            const move = (cx, cy) => {
                note.style.left = (cx - origOx) + 'px';
                note.style.top  = (cy - origOy) + 'px';
                note.style.transform = `scale(1.02)`;

                // Move all other selected notes together
                selectedOffsets.forEach(({ el, ox, oy }) => {
                    el.style.left = (cx - ox) + 'px';
